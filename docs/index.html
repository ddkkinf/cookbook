    function toggleAllIngredientInfos() {
        const cards = Array.from(document.querySelectorAll('#scaled-ingredients-list li.has-info, #modal-containers-box .prep-container-item.has-info'));
        if (cards.length === 0) return;
        const shouldOpen = !cards.every(c => c.classList.contains('info-open'));
        cards.forEach(c => c.classList.toggle('info-open', shouldOpen));
        syncAllInfoToggleButton();
    }

    function renderIngredientsHtml(recipe, targetServings, smartEnabled, varContext = null) {
        const ctx = varContext || buildVariableContext(recipe, targetServings, smartEnabled);
        const { varMap, rawRatio } = ctx;
        let anySmartAdjusted = false;
        const { ingredients: effectiveIngredients } = getEffectiveRecipeView(recipe, varMap);
        const gRatio = appSettings.gochujangRatio;
        const isGochujangCustom = Math.abs(gRatio - 1) >= 0.01;

        // Count duplicate primary names in current view so same-name items (e.g. 고춧가루 2종) stay distinguishable
        const baseCounts = new Map();
        for (const ing of effectiveIngredients) {
            const { primary } = splitParentheticalLabel(ing.name);
            baseCounts.set(primary, (baseCounts.get(primary) || 0) + 1);
        }

        const itemsHtml = effectiveIngredients.map((ing, idx) => {
            const computed = (ing.varKey && varMap.has(ing.varKey))
                ? varMap.get(ing.varKey)
                : computeScaledEntry(ing, rawRatio, smartEnabled, gRatio);
            const { scaledAmt, factor, reason, isGochujang, isNonLinearAdjusted } = computed;
            if (isNonLinearAdjusted) anySmartAdjusted = true;

            const { primary: baseName, sub: nameSub } = splitParentheticalLabel(ing.name);
            const { primary: shortAmt, sub: amtSub } = splitParentheticalLabel(scaledAmt);
            const isDupBase = (baseCounts.get(baseName) || 0) > 1;
            const dupRoleTagHtml = (isDupBase && nameSub)
                ? `<span class="ing-role-tag">${shortenDuplicateRoleHint(nameSub)}</span>`
                : '';
            const addonDotHtml = ing.isAddon
                ? `<span class="ing-addon-dot">+옵션</span>`
                : '';

            const ratioDiffText = isNonLinearAdjusted
                ? `<span class="smart-adj-badge">${reason} (${rawRatio.toFixed(1).replace(/\.0$/, '')}배 → ${factor.toFixed(2).replace(/0$/, '').replace(/\.$/, '')}배)</span>`
                : '';

            const gochujangBadgeHtml = (isGochujang && isGochujangCustom)
                ? `<span class="gochujang-adj-badge">🌶️ 고추장 ${Math.round(gRatio * 100)}%</span>`
                : '';

            const addonBadgeHtml = ing.isAddon
                ? `<span class="addon-ing-badge">➕ ${ing.addonTitle || '옵션 추가'}</span>`
                : '';

            const resolvedNote = resolveTokensPlain(ing.rawNote || ing.note || '', varMap);
            const rightBadges = [addonBadgeHtml, gochujangBadgeHtml, ratioDiffText].filter(Boolean).join(' ');

            const infoLines = [];
            if (nameSub) {
                infoLines.push(`<div class="ing-info-line"><span>🏷️</span><span>${nameSub}</span></div>`);
            }
            if (amtSub) {
                infoLines.push(`<div class="ing-info-line"><span>⚖️</span><span>정밀 계량: <strong>${scaledAmt}</strong></span></div>`);
            }
            if (resolvedNote) {
                infoLines.push(`<div class="ing-info-line"><span>🔪</span><span>${resolvedNote}</span></div>`);
            }
            if (rightBadges) {
                infoLines.push(`<div class="ing-info-badges">${rightBadges}</div>`);
            }

            const hasInfo = infoLines.length > 0;
            const ingKey = ing.varKey || `ing_${idx}`;
            const liClasses = [
                ing.isAddon ? 'addon-ing-item' : ((isNonLinearAdjusted || (isGochujang && isGochujangCustom)) ? 'scaled-highlight' : ''),
                hasInfo ? 'has-info' : ''
            ].filter(Boolean).join(' ');

            return `
                <li class="${liClasses}" data-ing-key="${ingKey}" ${hasInfo ? 'onclick="toggleInfoCard(this)"' : ''}>
                    <div class="ing-row-main">
                        <span class="ing-name">${addonDotHtml}${baseName}${dupRoleTagHtml}</span>
                        <span class="ing-right-group">
                            <span class="ing-amount">${shortAmt}</span>
                            ${hasInfo ? '<span class="ing-info-btn" aria-label="상세 정보">i</span>' : ''}
                        </span>
                    </div>
                    ${hasInfo ? `<div class="ing-info-drawer">${infoLines.join('')}</div>` : ''}
                </li>
            `;
        }).join('');

        return { itemsHtml, anySmartAdjusted, rawRatio, varMap };
    }

    function renderContainersHtml(recipe, varMap) {
        const { containers } = getEffectiveRecipeView(recipe, varMap);
        if (!containers || containers.length === 0) return '';

        const listHtml = containers.map((ct, idx) => {
            const { primary: ctName, sub: ctSub } = splitParentheticalLabel(ct.name);
            const addonDot = ct.isAddon ? `<span class="ing-addon-dot">+옵션</span>` : '';
            const noteHtml = formatInlineMdWithVars(ct.rawNote || '', varMap);
            const infoLines = [];
            if (ctSub) infoLines.push(`<div class="ing-info-line"><span>🏷️</span><span>${ctSub}</span></div>`);
            if (noteHtml) infoLines.push(`<div class="ing-info-line"><span>💡</span><span>${noteHtml}</span></div>`);
            const hasInfo = infoLines.length > 0;
            const ctKey = `ct_${ct.isAddon ? (ct.addonId + '_') : ''}${idx}`;

            return `
                <li class="prep-container-item ${hasInfo ? 'has-info' : ''}" data-ct-key="${ctKey}" ${hasInfo ? 'onclick="toggleInfoCard(this)"' : ''}>
                    <div class="ing-row-main">
                        <span class="prep-container-name">🥣 ${addonDot}${ctName}</span>
                        ${hasInfo ? '<span class="ing-right-group"><span class="ing-info-btn" aria-label="용기 용도 보기">i</span></span>' : ''}
                    </div>
                    ${hasInfo ? `<div class="ing-info-drawer">${infoLines.join('')}</div>` : ''}
                </li>
            `;
        }).join('');

        return `
            <div class="prep-containers-card">
                <div class="prep-containers-header">
                    <span class="prep-containers-title">🥣 미리 준비할 용기 · 조리도구</span>
                    <span class="prep-containers-sub">항목을 누르면 용도가 펼쳐져요</span>
                </div>
                <ul class="prep-containers-list">
                    ${listHtml}
                </ul>
            </div>
        `;
    }

    function renderStepsHtml(recipe, varMap = null) {
        const ctxMap = varMap || buildVariableContext(recipe, currentServings, smartScaleEnabled).varMap;
        const { steps: effectiveSteps, ingredients: effectiveIngredients } = getEffectiveRecipeView(recipe, ctxMap);
        const gRatio = appSettings.gochujangRatio;
        const isGochujangCustom = Math.abs(gRatio - 1) >= 0.01;
        const gochujangIng = effectiveIngredients.find(i => isGochujangIngredient(i.name));

        return effectiveSteps.map(step => {
            const stepKey = step.isAddon
                ? `${activeVariationMode}_addon_${step.addonId || ''}_${step.addonStepIdx ?? step.index}`
                : `${activeVariationMode}_base_${step.baseIndex ?? step.index}`;
            const addonPrefix = step.isAddon
                ? `<span class="addon-ing-badge" style="margin-right:0.35rem; vertical-align:middle;">➕ ${step.addonTitle}</span>`
                : '';
            const prepBadgeHtml = (step.isPrepStep && !step.isAddon)
                ? `<span class="prep-step-badge">🔪 ${step.index}단계 · 사전 재료 손질</span>`
                : '';

            const stepTitleHtml = step.rawTitle
                ? formatInlineMdWithVars(step.rawTitle, ctxMap)
                : step.titleHtml;

            const stepBodyHtml = Array.isArray(step.rawLines)
                ? step.rawLines.map(l => {
                    if (/^[*-]\s+/.test(l)) {
                        return '&nbsp;&nbsp;• ' + formatInlineMdWithVars(l.replace(/^[*-]\s+/, ''), ctxMap);
                    }
                    return formatInlineMdWithVars(l, ctxMap);
                }).join('<br>')
                : step.bodyHtml;

            const addonAdditions = Array.isArray(step.addonAdditions) ? step.addonAdditions : [];
            const addonAdditionsHtml = addonAdditions.length > 0
                ? `<div class="step-addon-injections">${addonAdditions.map(inj => {
                    const injTitleHtml = inj.rawTitle
                        ? formatInlineMdWithVars(inj.rawTitle, ctxMap)
                        : (inj.titleHtml || '');
                    const injBodyHtml = Array.isArray(inj.rawLines)
                        ? inj.rawLines.map(l => {
                            if (/^[*-]\s+/.test(l)) {
                                return '&nbsp;&nbsp;• ' + formatInlineMdWithVars(l.replace(/^[*-]\s+/, ''), ctxMap);
                            }
                            return formatInlineMdWithVars(l, ctxMap);
                        }).join('<br>')
                        : (inj.bodyHtml || '');
                    return `
                        <div class="step-addon-injection-box">
                            <div class="step-addon-injection-title">➕ ${inj.addonTitle}${injTitleHtml ? ` · ${injTitleHtml}` : ''}</div>
                            <div class="step-addon-injection-body">${injBodyHtml}</div>
                        </div>
                    `;
                }).join('')}</div>`
                : '';

            const stepMentionsGochujang = isGochujangCustom && /고추장/.test((stepBodyHtml || '') + ' ' + addonAdditionsHtml);
            let gochujangStepNoteHtml = '';
            if (stepMentionsGochujang && gochujangIng) {
                const gComp = (gochujangIng.varKey && ctxMap.has(gochujangIng.varKey))
                    ? ctxMap.get(gochujangIng.varKey)
                    : computeScaledEntry(gochujangIng, currentServings / (recipe.baseServings || 1), smartScaleEnabled, gRatio);
                gochujangStepNoteHtml = `
                    <div class="step-gochujang-note">
                        🌶️ 고추장 ${Math.round(gRatio * 100)}% 설정 반영됨 (${currentServings}인분 기준 <strong>${gComp.scaledAmt}</strong>)
                    </div>
                `;
            }

            const stepImagesHtml = (step.images && step.images.length > 0)
                ? step.images.map(img => {
                    const safeSrc = img.src.replace(/'/g, "\\'");
                    const safeAlt = (img.alt || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    return `
                        <div class="step-guide-figure" onclick="openImageLightboxFromContainer(this, '${safeSrc}', '${safeAlt}', event)">
                            <img src="${img.src}" alt="${safeAlt}" loading="lazy" onerror="handleRecipeImgError(this, '')">
                            <div class="step-guide-caption">
                                <span>🎨 조리 포인트 그림 · ${img.alt}</span>
                                <span style="font-weight:500; opacity:0.75;">🔍 크게 보기</span>
                            </div>
                        </div>
                    `;
                }).join('')
                : '';

            const itemClasses = [
                'step-item',
                step.isAddon ? 'addon-step-item' : '',
                (step.isPrepStep && !step.isAddon) ? 'prep-step-item' : ''
            ].filter(Boolean).join(' ');

            return `
                <div class="${itemClasses}" data-step-key="${stepKey}" onclick="toggleStep(this)">
                    <div class="step-checkbox">✓</div>
                    <div class="step-content-col">
                        <div class="step-text">
                            ${addonPrefix}${prepBadgeHtml}<strong>Step ${step.index}. ${stepTitleHtml}</strong><br>
                            ${stepBodyHtml}
                            ${addonAdditionsHtml}
                        </div>
                        ${gochujangStepNoteHtml}
                        ${stepImagesHtml}
                        ${step.timers.length > 0 ? `
                        <div class="step-timers-bar">
                            ${step.timers.map(tm => `
                                <button class="step-timer-pill" onclick="startCookingTimer(${tm.seconds}, '${(recipe.title + ' · ' + tm.label).replace(/'/g, "\\'")}', event)">
                                    ⏱️ ${tm.display} 타이머 시작
                                </button>
                            `).join('')}
                        </div>` : ''}
                    </div>
                </div>
            `;
        }).join('');
    }

    function reRenderStepsPreservingChecks(recipe, varMap) {
        const stepsListEl = document.getElementById('modal-steps-list');
        if (!stepsListEl) return;
        const completedKeys = new Set();
        stepsListEl.querySelectorAll('.step-item.completed[data-step-key]').forEach(el => {
            completedKeys.add(el.getAttribute('data-step-key'));
        });
        stepsListEl.innerHTML = renderStepsHtml(recipe, varMap);
        if (completedKeys.size > 0) {
            stepsListEl.querySelectorAll('.step-item[data-step-key]').forEach(el => {
                if (completedKeys.has(el.getAttribute('data-step-key'))) {
                    el.classList.add('completed');
                }
            });
        }
    }

    function renderFullMarkdownForServings(recipe, targetServings, varMap) {
        let md = recipe.rawMarkdown
            .replace(/^\*\s+\*\*검증\s*상태:\*\*[^\r\n]*\r?\n/gm, '')
            .replace(/\n###+\s*📌?\s*조리\s*내\s*계량\s*변수[\s\S]*?(?=\n###|\n---|\n##\s|$)/g, '\n');

        // Update overview & ingredients headings to reflect targetServings
        const servNote = Math.abs(targetServings - (recipe.baseServings || 1)) >= 0.01
            ? `${targetServings}인분 기준 *(기본 ${recipe.baseServings}인분에서 자동 환산)*`
            : `${targetServings}인분 기준`;
        md = md.replace(/^([*-]\s+\*\*(?:조리\s*분량|분량):\*\*)\s*[^\r\n]+/m, `$1 ${servNote}`);
        md = md.replace(/^(##\s*🛒?\s*재료)[^\r\n]*/m, `$1 (${targetServings}인분 기준)`);
        md = md.replace(/^(###+\s+Step\s*\d+\.\s*)\[(?:재료\s*손질|사전\s*손질|밑준비)\]\s*/gim, '$1🔪 [사전 재료 손질] ');
        md = md.replace(/^(####\s+)\[\s*Step\s*(\d+)\s*에\s*추가\s*\]\s*/gim, '$1➕ [Step $2 단계에 함께 진행] ');
        md = md.replace(/^(####\s+)\[\s*Step\s*(\d+)\s*다음\s*\]\s*/gim, '$1➕ [Step $2 직후 진행] ');

        // Strip internal '변수' column from 4-column ingredient tables and inject scaled quantities
        let inVarTable = false;
        const transformedLines = md.split('\n').map(line => {
            const cells = splitMarkdownTableRow(line);
            if (!cells) {
                if (line.trim() !== '') inVarTable = false;
                return line;
            }
            const c0Plain = (cells[0] || '').replace(/[*`]/g, '').trim();
            if (c0Plain === '변수' && cells.length >= 3) {
                inVarTable = true;
                const restHeader = cells.slice(1).map((c, idx) => (idx === 1 ? `수량 / 분량 (${targetServings}인분)` : c));
                return '| ' + restHeader.join(' | ') + ' |';
            }
            if (inVarTable && isTableSeparatorCells(cells) && cells.length >= 3) {
                return '| ' + cells.slice(1).join(' | ') + ' |';
            }
            if (inVarTable && cells.length >= 3 && /^`?[a-zA-Z_][a-zA-Z0-9_]*`?$/.test(cells[0])) {
                const key = cells[0].replace(/`/g, '').trim();
                const entry = varMap ? varMap.get(key) : null;
                const rest = cells.slice(1);
                if (entry) rest[1] = entry.scaledAmt;
                return '| ' + rest.join(' | ') + ' |';
            }
            return line;
        });

        const cleanedMd = resolveTokensPlain(transformedLines.join('\n'), varMap)
            .replace(/^>\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*$/gm, (_, type) => {
                const labelMap = { NOTE: '📌 참고', TIP: '💡 팁', IMPORTANT: '⭐ 핵심 체크', WARNING: '⚠️ 주의', CAUTION: '🚨 주의' };
                return `> **${labelMap[type] || type}**`;
            })
            .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, alt, url) => `![${alt}](${resolveRecipeImageUrl(url)})`);

        return typeof marked !== 'undefined' ? marked.parse(cleanedMd, { breaks: true }) : '';
    }

    function formatServingsMetaBadgeHtml(recipe, targetServings) {
        if (Math.abs(targetServings - (recipe.baseServings || 1)) < 0.01) {
            return `👥 <strong>조리 분량:</strong> ${targetServings}인분 기준`;
        }
        return `👥 <strong>현재 분량:</strong> <strong style="color:var(--primary-dark);">${targetServings}인분</strong> <span style="font-size:0.82em; opacity:0.75;">(기본 ${recipe.baseServings}인분)</span>`;
    }

    function refreshModalVariationSections() {
        const recipe = allRecipes.find(r => r.id === activeRecipeId);
        if (!recipe) return;

        // Update mode tabs active state
        document.querySelectorAll('.variation-mode-btn[data-mode-id]').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('data-mode-id') === activeVariationMode);
        });

        // Show/hide add-on chips bar depending on whether base mode is selected
        const addonsWrap = document.getElementById('variation-addons-wrap');
        if (addonsWrap) {
            addonsWrap.style.display = (activeVariationMode === 'base' && recipe.addons && recipe.addons.length > 0) ? 'block' : 'none';
        }
        document.querySelectorAll('.variation-addon-chip[data-addon-id]').forEach(chip => {
            const id = chip.getAttribute('data-addon-id');
            const isActive = activeAddonIds.has(id);
            chip.classList.toggle('active', isActive);
            const iconSpan = chip.querySelector('.addon-check-icon');
            if (iconSpan) iconSpan.textContent = isActive ? '✓' : '+';
        });

        // Re-render everything (ingredients, containers, steps, notes, headers, full markdown) via single pipeline
        updateServingPortion(currentServings);
    }

    function selectVariationMode(modeId) {
        activeVariationMode = modeId;
        refreshModalVariationSections();
    }

    function toggleVariationAddon(addonId) {
        if (activeAddonIds.has(addonId)) {
            activeAddonIds.delete(addonId);
        } else {
            activeAddonIds.add(addonId);
        }
        refreshModalVariationSections();
    }

    function updateServingPortion(newServings) {
        const recipe = allRecipes.find(r => r.id === activeRecipeId);
        if (!recipe) return;

        const parsed = parseFloat(newServings);
        if (isNaN(parsed) || parsed < 0.5) return;
        currentServings = Math.min(20, Math.round(parsed * 2) / 2);

        const inputEl = document.getElementById('serving-number-input');
        if (inputEl && document.activeElement !== inputEl) {
            inputEl.value = currentServings;
        }
        const minusBtn = document.getElementById('serving-minus-btn');
        if (minusBtn) minusBtn.disabled = currentServings <= 0.5;

        // Update preset chips active state
        document.querySelectorAll('.preset-chip[data-servings]').forEach(chip => {
            const val = parseFloat(chip.getAttribute('data-servings'));
            chip.classList.toggle('active', Math.abs(val - currentServings) < 0.01);
        });

        // Single-source-of-truth variable context for current N servings
        const varContext = buildVariableContext(recipe, currentServings, smartScaleEnabled);
        const { itemsHtml, anySmartAdjusted, rawRatio, varMap } = renderIngredientsHtml(recipe, currentServings, smartScaleEnabled, varContext);

        // 1) Top meta badge & section headers
        const servMetaEl = document.getElementById('modal-servings-meta');
        if (servMetaEl) servMetaEl.innerHTML = formatServingsMetaBadgeHtml(recipe, currentServings);

        const ingHeadingEl = document.getElementById('modal-ingredients-heading');
        if (ingHeadingEl) {
            ingHeadingEl.innerHTML = `🛒 필요 재료 <span class="section-serving-pill">${currentServings}인분 기준</span>`;
        }
        const stepsHeadingEl = document.getElementById('modal-steps-heading');
        if (stepsHeadingEl) {
            stepsHeadingEl.innerHTML = `🔥 조리 순서 & 타이머 <span class="section-serving-pill">${currentServings}인분 기준</span>`;
        }

        // 2) Variation description box (resolved with N-serving variables)
        const { notesHtml } = getEffectiveRecipeView(recipe, varMap);
        const descBox = document.getElementById('variation-desc-box');
        if (descBox) {
            if (notesHtml) {
                descBox.innerHTML = notesHtml;
                descBox.classList.add('visible');
            } else {
                descBox.innerHTML = '';
                descBox.classList.remove('visible');
            }
        }

        // 3) Ingredients list + Advance containers box right underneath (preserving any opened ⓘ drawers)
        const listEl = document.getElementById('scaled-ingredients-list');
        if (listEl) {
            const openIngKeys = new Set();
            listEl.querySelectorAll('li.info-open[data-ing-key]').forEach(el => openIngKeys.add(el.getAttribute('data-ing-key')));
            listEl.innerHTML = itemsHtml;
            if (openIngKeys.size > 0) {
                listEl.querySelectorAll('li[data-ing-key]').forEach(el => {
                    if (openIngKeys.has(el.getAttribute('data-ing-key'))) el.classList.add('info-open');
                });
            }
        }

        const containersBoxEl = document.getElementById('modal-containers-box');
        if (containersBoxEl) {
            const openCtKeys = new Set();
            containersBoxEl.querySelectorAll('.prep-container-item.info-open[data-ct-key]').forEach(el => openCtKeys.add(el.getAttribute('data-ct-key')));
            containersBoxEl.innerHTML = renderContainersHtml(recipe, varMap);
            if (openCtKeys.size > 0) {
                containersBoxEl.querySelectorAll('.prep-container-item[data-ct-key]').forEach(el => {
                    if (openCtKeys.has(el.getAttribute('data-ct-key'))) el.classList.add('info-open');
                });
            }
        }
        syncAllInfoToggleButton();

        // 4) Smart scale banner
        const bannerEl = document.getElementById('smart-scale-banner');
        if (bannerEl) {
            if (anySmartAdjusted && smartScaleEnabled) {
                bannerEl.classList.add('visible');
                bannerEl.innerHTML = `💡 <strong>스마트 양념 보정 적용 중 (${recipe.baseServings}인분 → ${currentServings}인분):</strong> 재료와 조리 순서 전체가 <strong>${currentServings}인분</strong>으로 연동되었으며, 주재료는 <strong>${Number(rawRatio.toFixed(2))}배</strong>·소금·간장·고추장·식용유·육수는 짜지 않게 요리 비율로 자동 보정했습니다.`;
            } else {
                bannerEl.classList.remove('visible');
            }
        }

        // 5) Cooking steps (preserving completed checkmarks)
        reRenderStepsPreservingChecks(recipe, varMap);

        // 6) Collapsible full markdown view
        const fullMdEl = document.getElementById('modal-rendered-markdown');
        if (fullMdEl) {
            fullMdEl.innerHTML = renderFullMarkdownForServings(recipe, currentServings, varMap);
        }
    }

    function changeServingDelta(delta) {
        const step = (currentServings <= 1 && delta < 0) ? 0.5 : (currentServings === 0.5 && delta > 0 ? 0.5 : 1);
        const next = currentServings + (delta > 0 ? step : -step);
        const clamped = Math.max(0.5, Math.min(20, next));
        const inputEl = document.getElementById('serving-number-input');
        if (inputEl) inputEl.value = clamped;
        updateServingPortion(clamped);
    }

    function toggleSmartScale(checked) {
        smartScaleEnabled = checked;
        updateServingPortion(currentServings);
    }

    function openRecipe(id, pushHistory = true) {
        const recipe = allRecipes.find(r => r.id === id);
        if (!recipe) return;

        const isSameAlreadyOpen = activeRecipeId === id && modal.classList.contains('active');
        activeRecipeId = id;
        if (!isSameAlreadyOpen) {
            activeVariationMode = 'base';
            activeAddonIds = new Set();
            currentServings = recipe.baseServings || 1;
            startRecipeViewTracker(id);
        }

        const varContext = buildVariableContext(recipe, currentServings, smartScaleEnabled);
        const { itemsHtml, varMap } = renderIngredientsHtml(recipe, currentServings, smartScaleEnabled, varContext);
        const containersHtml = renderContainersHtml(recipe, varMap);
        const stepsHtml = renderStepsHtml(recipe, varMap);
        const renderedMarkdown = renderFullMarkdownForServings(recipe, currentServings, varMap);
        const hasModes = recipe.modes && recipe.modes.length > 0;
        const hasAddons = recipe.addons && recipe.addons.length > 0;
        const hasVariations = hasModes || hasAddons;
        const escapedId = recipe.id.replace(/'/g, "\\'");

        const variationSelectorHtml = hasVariations ? `
            <div class="variation-selector-card">
                <div class="variation-header">
                    <h4>🎛️ 베리에이션 & 조리 방식 선택</h4>
                    <span class="variation-subhint">선택에 맞춰 재료·준비 용기·조리 순서가 자동 반영됩니다</span>
                </div>
                ${hasModes ? `
                <div class="variation-mode-tabs">
                    <button class="variation-mode-btn ${activeVariationMode === 'base' ? 'active' : ''}" data-mode-id="base" onclick="selectVariationMode('base')">
                        ✨ 기본 조리
                    </button>
                    ${recipe.modes.map(m => `
                        <button class="variation-mode-btn ${activeVariationMode === m.id ? 'active' : ''}" data-mode-id="${m.id}" onclick="selectVariationMode('${m.id}')">
                            ${m.title}
                        </button>
                    `).join('')}
                </div>` : ''}
                ${hasAddons ? `
                <div id="variation-addons-wrap" class="variation-addons-wrap" style="${hasModes ? '' : 'margin-top:0; padding-top:0; border-top:none;'} ${activeVariationMode !== 'base' ? 'display:none;' : ''}">
                    <span class="variation-addons-label">➕ 취향대로 추가/제외 옵션 (중복 선택 가능)</span>
                    <div class="variation-addons-chips">
                        ${recipe.addons.map(a => {
                            const active = activeAddonIds.has(a.id);
                            return `
                                <button class="variation-addon-chip ${active ? 'active' : ''}" data-addon-id="${a.id}" onclick="toggleVariationAddon('${a.id}')">
                                    <span class="addon-check-icon">${active ? '✓' : '+'}</span> ${a.title}
                                </button>
                            `;
                        }).join('')}
                    </div>
                </div>` : ''}
                <div id="variation-desc-box" class="variation-desc-box"></div>
            </div>
        ` : '';

        const heroBannerHtml = recipe.heroImage ? `
            <div class="modal-hero-banner" onclick="openImageLightboxFromContainer(this, '${recipe.heroImage.replace(/'/g, "\\'")}', '${(recipe.heroImageAlt || recipe.title).replace(/'/g, "\\'").replace(/"/g, '&quot;')}', event)">
                <img src="${recipe.heroImage}" alt="${recipe.title.replace(/"/g, '&quot;')}" onerror="handleRecipeImgError(this, '')">
            </div>
        ` : '';

        modalBody.innerHTML = `
            <div class="recipe-header">
                <h2>${recipe.icon} ${recipe.title}</h2>
                <p>${recipe.description}</p>
            </div>

            ${heroBannerHtml}

            <div class="recipe-meta">
                <span id="modal-servings-meta">${formatServingsMetaBadgeHtml(recipe, currentServings)}</span>
                <span>🕒 <strong>소요시간:</strong> ${recipe.time}</span>
                <span>📊 <strong>난이도:</strong> ${recipe.difficulty}</span>
                <span>🍽️ <strong>분류:</strong> ${recipe.category}</span>
            </div>

            ${variationSelectorHtml}

            <!-- SMART SERVING & PORTION CALCULATOR -->
            ${(recipe.ingredients.length > 0 || hasVariations) ? `
            <div class="serving-calculator-card">
                <div class="serving-top-row">
                    <div class="serving-title-group">
                        <h4>⚖️ 인분 조절 & 전 구간 자동 계량</h4>
                        <span class="serving-base-hint">기준 ${recipe.baseServings}인분 · 변경 시 재료·용기·조리 순서 모든 분량이 함께 바뀝니다</span>
                    </div>
                    <div class="serving-stepper">
                        <button id="serving-minus-btn" class="stepper-btn" onclick="changeServingDelta(-1)" ${currentServings <= 0.5 ? 'disabled' : ''}>−</button>
                        <input id="serving-number-input" type="number" step="0.5" min="0.5" max="20" class="serving-input" value="${currentServings}" oninput="updateServingPortion(this.value)">
                        <span class="serving-unit-label">인분</span>
                        <button class="stepper-btn" onclick="changeServingDelta(1)">+</button>
                    </div>
                </div>
                <div class="serving-presets-row">
                    <div class="preset-chips">
                        ${[1, 2, 3, 4].map(n => `
                            <button class="preset-chip ${currentServings === n ? 'active' : ''}" data-servings="${n}" onclick="document.getElementById('serving-number-input').value=${n}; updateServingPortion(${n});">
                                ${n}인분${n === recipe.baseServings ? ' (기본)' : ''}
                            </button>
                        `).join('')}
                    </div>
                    <label class="smart-scale-toggle">
                        <input type="checkbox" ${smartScaleEnabled ? 'checked' : ''} onchange="toggleSmartScale(this.checked)">
                        🧠 스마트 양념 보정
                    </label>
                </div>
                ${recipeHasGochujang(recipe) ? `
                <div class="gochujang-inline-bar">
                    <span class="gochujang-inline-label">🌶️ 고추장 비율 옵션:</span>
                    <div class="gochujang-chip-group">
                        ${[0.5, 0.7, 0.85, 1.0].map(val => `
                            <button class="gochujang-chip ${Math.abs(appSettings.gochujangRatio - val) < 0.01 ? 'active' : ''}" data-gochujang-preset="${val}" onclick="setGochujangRatio(${val}, false)">
                                ${Math.round(val * 100)}%${val === 0.7 ? ' (깔끔)' : (val === 1.0 ? ' (기본)' : '')}
                            </button>
                        `).join('')}
                        <button class="gochujang-chip" onclick="closeModal(); navigateToTab('settings');" title="설정에서 세밀 조절">
                            ⚙️ 세밀 조절
                        </button>
                    </div>
                </div>` : ''}
                <div id="smart-scale-banner" class="smart-scale-banner"></div>
            </div>

            <div class="recipe-section">
                <div class="recipe-section-header">
                    <h4 id="modal-ingredients-heading">🛒 필요 재료 <span class="section-serving-pill">${currentServings}인분 기준</span></h4>
                    <button id="ing-all-info-btn" class="ing-all-info-toggle" onclick="toggleAllIngredientInfos()">ⓘ 상세 설명 모두 보기</button>
                </div>
                <ul id="scaled-ingredients-list" class="ingredients-list">
                    ${itemsHtml}
                </ul>
                <div id="modal-containers-box">
                    ${containersHtml}
                </div>
            </div>` : ''}

            ${(recipe.steps.length > 0 || hasVariations) ? `
            <div class="recipe-section">
                <div class="recipe-section-header">
                    <h4 id="modal-steps-heading">🔥 조리 순서 & 타이머 <span class="section-serving-pill">${currentServings}인분 기준</span></h4>
                    <button class="custom-timer-trigger" onclick="openCustomTimerPrompt()">⏱️ + 직접 타이머 설정</button>
                </div>
                <div id="modal-steps-list" class="steps-list">
                    ${stepsHtml}
                </div>
            </div>` : ''}

            <div id="modal-comment-box-container">
                ${recipe.comment ? `
                <div class="recipe-comment-box">
                    <span>📝</span>
                    <div>
                        <strong>나만의 조리 메모:</strong><br>
                        ${recipe.comment}
                    </div>
                </div>` : ''}
            </div>

            <!-- Personal Cooking Memo Panel -->
            <div class="interactive-status-panel">
                <h4>
                    <span>📝 나만의 조리 메모 기록</span>
                    <span style="display:flex; align-items:center; gap:0.45rem;">
                        <span style="font-size:0.76rem; color:var(--text-muted); font-weight:500;">${getGitHubToken() ? '🟢 GitHub + 기기 저장' : '💾 기기 자동 저장'}</span>
                        <button onclick="configureGitHubToken('${escapedId}')" style="background:none; border:1px solid #D1D5DB; border-radius:6px; padding:0.2rem 0.5rem; font-size:0.74rem; cursor:pointer; color:#4B5563;">
                            ${getGitHubToken() ? 'GitHub 연동됨' : 'GitHub 연동'}
                        </button>
                    </span>
                </h4>

                <div class="comment-editor-wrapper">
                    <input type="text" id="recipe-comment-input" class="comment-input" placeholder="간 조절이나 다음번 조리 메모를 남겨보세요..." value="${recipe.comment ? recipe.comment.replace(/"/g, '&quot;') : ''}" onkeydown="if(event.key==='Enter') saveRecipeComment('${escapedId}')">
                    <button class="save-comment-btn" onclick="saveRecipeComment('${escapedId}')">저장</button>
                </div>
            </div>

            <div class="recipe-section">
                <details class="raw-md-details">
                    <summary>📖 레시피 원문 및 꿀팁 전체 보기 <span>▾</span></summary>
                    <div id="modal-rendered-markdown" class="recipe-rendered-body">
                        ${renderedMarkdown}
                    </div>
                </details>
            </div>

            <div class="recipe-footer-actions">
                <a href="https://github.com/${GITHUB_REPO}/blob/${GITHUB_BRANCH}/${recipe.path}" target="_blank">
                    GitHub 원본 파일 보기 (${recipe.path})
                </a>
            </div>
        `;

        // Sync smart banner & variation description box if re-opened with non-default state
        updateServingPortion(currentServings);

        modal.classList.add('active');
        document.body.classList.add('modal-open');
        document.body.style.overflow = 'hidden';
        if (appSettings.autoWakeLockOnCook) {
            requestWakeLockAutomatically();
        }
        updateWakeLockButtonUI();

        if (pushHistory) {
            try {
                history.pushState({ modalOpen: true, recipeId: id, tab: currentTab }, '');
            } catch (_) {}
        }
    }

    // =========================================================================
    // 6. LOCAL STORAGE & GITHUB DIRECT SYNC HELPERS
    // =========================================================================

    function getLocalRecipeState(recipeId) {
        try {
            const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
            if (!raw) return null;
            const map = JSON.parse(raw);
            return map[recipeId] || null;
        } catch (e) {
            return null;
        }
    }

    function saveLocalRecipeState(recipeId, comment) {
        try {
            const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
            const map = raw ? JSON.parse(raw) : {};
            map[recipeId] = { comment, updatedAt: new Date().toISOString() };
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(map));
        } catch (e) {
            console.error('Failed to save to localStorage:', e);
        }
    }

    function getGitHubToken() {
        return localStorage.getItem(GITHUB_TOKEN_KEY) || '';
    }

    function configureGitHubToken(currentRecipeId) {
        const current = getGitHubToken();
        const input = prompt(
            'GitHub Personal Access Token을 입력하면 조리 메모 저장 시 GitHub의 마크다운(.md) 원본도 자동 업데이트됩니다.\n(비워두고 확인을 누르면 기기 저장 모드로 전환됩니다.)',
            current
        );
        if (input === null) return;
        const trimmed = input.trim();
        if (trimmed) {
            localStorage.setItem(GITHUB_TOKEN_KEY, trimmed);
            showToast('GitHub 연동이 설정되었습니다!');
        } else {
            localStorage.removeItem(GITHUB_TOKEN_KEY);
            showToast('기기 저장 모드로 전환되었습니다.');
        }
        if (currentRecipeId) openRecipe(currentRecipeId, false);
    }

    let toastTimer = null;
    function showToast(message) {
        const toast = document.getElementById('toast-notify');
        const text = document.getElementById('toast-text');
        if (!toast || !text) return;
        text.textContent = message;
        toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            toast.classList.remove('show');
        }, 2600);
    }

    function updateMarkdownComment(mdContent, comment) {
        let updated = mdContent;
        if (/^[*-]?\s*\*\*?(?:코멘트|메모|피드백|노트|comment)[^*:\n\r]*[:*]+[ \t]*([^\r\n]*)/im.test(updated)) {
            updated = updated.replace(
                /^([*-]?\s*\*\*?(?:코멘트|메모|피드백|노트|comment)[^*:\n\r]*[:*]+)[ \t]*([^\r\n]*)/im,
                comment ? `$1 ${comment}` : `$1 `
            );
        }
        return updated;
    }

    async function syncRecipeToGitHub(recipe) {
        const token = getGitHubToken();
        if (!token) return false;
        try {
            const apiUrl = `https://api.github.com/repos/${GITHUB_REPO}/contents/${recipe.path}?ref=${GITHUB_BRANCH}`;
            const getRes = await fetch(apiUrl, {
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });
            if (!getRes.ok) throw new Error(`조회 실패 (${getRes.status})`);
            const fileData = await getRes.json();

            const updatedMd = updateMarkdownComment(recipe.rawMarkdown, recipe.comment);
            recipe.rawMarkdown = updatedMd;
            const base64Content = btoa(unescape(encodeURIComponent(updatedMd)));

            const putRes = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${recipe.path}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `docs(${recipe.title}): 조리 메모 업데이트`,
                    content: base64Content,
                    sha: fileData.sha,
                    branch: GITHUB_BRANCH
                })
            });

            if (!putRes.ok) throw new Error(`저장 실패 (${putRes.status})`);
            return true;
        } catch (e) {
            showToast(`⚠️ 기기엔 저장되었으나 GitHub 반영 실패: ${e.message}`);
            return false;
        }
    }

    async function saveRecipeComment(id) {
        const recipe = allRecipes.find(r => r.id === id);
        if (!recipe) return;

        const commentInput = document.getElementById('recipe-comment-input');
        recipe.comment = commentInput ? commentInput.value.trim() : '';

        saveLocalRecipeState(recipe.id, recipe.comment);

        const commentBoxContainer = document.getElementById('modal-comment-box-container');
        if (commentBoxContainer) {
            commentBoxContainer.innerHTML = recipe.comment ? `
                <div class="recipe-comment-box">
                    <span>📝</span>
                    <div>
                        <strong>나만의 조리 메모:</strong><br>
                        ${recipe.comment}
                    </div>
                </div>` : '';
        }

        applyFilter();

        if (getGitHubToken()) {
            const ok = await syncRecipeToGitHub(recipe);
            if (ok) showToast('✅ 조리 메모가 GitHub 마크다운까지 저장되었습니다!');
        } else {
            showToast(recipe.comment ? '조리 메모가 저장되었습니다!' : '조리 메모가 삭제되었습니다.');
        }
    }

    function closeModal(fromPopState = false) {
        if (!modal.classList.contains('active')) return;
        finalizeRecipeViewTracker();
        modal.classList.remove('active');
        document.body.classList.remove('modal-open');
        document.body.style.overflow = 'auto';
        activeRecipeId = null;
        if (currentTab === 'home') {
            renderHomeDashboard();
        }
        if (!fromPopState && history.state && history.state.modalOpen) {
            try { history.back(); } catch (_) {}
        }
    }

    window.addEventListener('pagehide', () => {
        finalizeRecipeViewTracker();
    });

    function toggleStep(element) {
        element.classList.toggle('completed');
    }

    window.onclick = function(event) {
        if (event.target === modal) closeModal();
    };

    window.addEventListener('popstate', (e) => {
        if (modal.classList.contains('active')) {
            closeModal(true);
            return;
        }
        const targetTab = (e.state && e.state.tab) ? e.state.tab : 'home';
        if (currentTab !== targetTab) {
            navigateToTab(targetTab, { pushHistory: false });
        }
    });

    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.classList.contains('active')) {
            closeModal();
        }
    });

    // Android Hardware Back Button & Foreground Resume Auto-Sync via Capacitor App plugin
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
        window.Capacitor.Plugins.App.addListener('backButton', ({ canGoBack }) => {
            if (modal.classList.contains('active')) {
                closeModal();
            } else if (currentTab !== 'home') {
                navigateToTab('home', { pushHistory: false });
            } else if (canGoBack) {
                window.history.back();
            } else {
                window.Capacitor.Plugins.App.exitApp();
            }
        });

        // 앱을 백그라운드에서 다시 켤 때(기동/전환 시) 타이머 상태 갱신 및 웹 변경사항 즉시 체크
        window.Capacitor.Plugins.App.addListener('appStateChange', ({ isActive }) => {
            if (isActive) {
                evaluateTimersNow(false);
                syncRecipesFromGitHub(false, 'app_resume');
            }
        });
    }

    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.KitchenAlarm) {
        window.Capacitor.Plugins.KitchenAlarm.addListener('alarmFired', () => {
            nativeAlarmRinging = true;
            evaluateTimersNow(true);
        });
        window.Capacitor.Plugins.KitchenAlarm.addListener('alarmDismissedExternally', () => {
            nativeAlarmRinging = false;
            activeTimers = activeTimers.filter(t => !t.finished);
            syncNativeTimerSchedule();
            renderTimerDock();
        });
    }

    // 브라우저 탭 복귀 및 네트워크 재연결 시에도 자동 동기화
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
            evaluateTimersNow(false);
            syncRecipesFromGitHub(false, 'visibility');
        }
    });

    window.addEventListener('online', () => {
        syncRecipesFromGitHub(false, 'network_online');
    });

    // Initialize app immediately with local recipes + instant web diff sync
    loadInitialRecipes();
</script>

</body>
</html>
