    // Identical deterministic hash to scripts/bundle-recipes.mjs
    function computeRecipesHash(items) {
        if (!Array.isArray(items) || items.length === 0) return '0:0:0000000000000000';
        const sorted = [...items]
            .filter(it => it && it.path && typeof it.content === 'string')
            .sort((a, b) => (a.path < b.path ? -1 : (a.path > b.path ? 1 : 0)));
        let h1 = 0x811c9dc5;
        let h2 = 0x01000193;
        let totalLen = 0;
        for (let idx = 0; idx < sorted.length; idx++) {
            const chunk = sorted[idx].path + '\n' + sorted[idx].content.replace(/\r\n/g, '\n');
            totalLen += chunk.length;
            for (let i = 0; i < chunk.length; i++) {
                const c = chunk.charCodeAt(i);
                h1 ^= c;
                h1 = Math.imul(h1, 0x01000193);
                h2 ^= (c + i);
                h2 = Math.imul(h2, 0x85ebca6b);
            }
        }
        const hex1 = (h1 >>> 0).toString(16).padStart(8, '0');
        const hex2 = (h2 >>> 0).toString(16).padStart(8, '0');
        return `${sorted.length}:${totalLen}:${hex1}${hex2}`;
    }

    function setSyncPillState(mode, text, icon = '🔄') {
        const btn = document.getElementById('sync-status-btn');
        const iconEl = document.getElementById('sync-status-icon');
        const labelEl = document.getElementById('sync-status-label');
        if (btn) {
            btn.classList.remove('syncing', 'updated', 'offline');
            if (mode === 'syncing' || mode === 'updated' || mode === 'offline') {
                btn.classList.add(mode);
            }
        }
        if (iconEl) iconEl.textContent = icon;
        if (labelEl) labelEl.textContent = text;
    }

    async function fetchWithTimeout(url, options = {}, timeoutMs = SYNC_TIMEOUT_MS) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
            return await fetch(url, { ...options, signal: controller.signal });
        } finally {
            clearTimeout(timer);
        }
    }

    function applyLocalOverrides(recipes) {
        recipes.forEach(recipe => {
            const localData = getLocalRecipeState(recipe.id);
            if (localData) {
                if (localData.status) {
                    recipe.status = localData.status;
                    recipe.statusText = localData.status === 'verified' ? '검증 완료' : (localData.status === 'needs_fix' ? '수정 필요' : '미검증');
                }
                if (typeof localData.comment === 'string') {
                    recipe.comment = localData.comment;
                }
            }
        });
    }

    function applyRecipeItemsToUI(items, refreshOpenModalIfChanged = false) {
        const prevOpenMd = activeRecipeId
            ? (allRecipes.find(r => r.id === activeRecipeId) || {}).rawMarkdown
            : null;

        const parsed = items.map(item => parseRecipeMarkdown(item.content, item.path));
        applyLocalOverrides(parsed);
        allRecipes = parsed;
        setupFilterTabs();
        applyFilter();

        if (refreshOpenModalIfChanged && activeRecipeId && modal.classList.contains('active')) {
            const updatedOpen = allRecipes.find(r => r.id === activeRecipeId);
            if (updatedOpen && updatedOpen.rawMarkdown !== prevOpenMd) {
                if (activeVariationMode !== 'base' && !(updatedOpen.modes || []).some(m => m.id === activeVariationMode)) {
                    activeVariationMode = 'base';
                }
                openRecipe(activeRecipeId, false);
            }
        }
    }

    function loadInitialRecipes() {
        const bundledItems = Array.isArray(window.BUNDLED_RECIPES)
            ? window.BUNDLED_RECIPES.filter(it => it && it.path && typeof it.content === 'string')
            : [];
        const bundledTime = window.BUNDLED_AT ? Date.parse(window.BUNDLED_AT) : 0;
        const bundledHash = window.BUNDLED_HASH || computeRecipesHash(bundledItems);
        const bundledImgHashes = (window.BUNDLED_IMAGE_HASHES && typeof window.BUNDLED_IMAGE_HASHES === 'object')
            ? { ...window.BUNDLED_IMAGE_HASHES }
            : {};

        let initialItems = bundledItems;
        activeContentHash = bundledHash;
        activeImageHashes = bundledImgHashes;
        activeSyncCommitSha = '';
        activeCommitEtag = '';

        // Clean legacy cache keys & load newer synced local copy if available
        try {
            localStorage.removeItem('cookbook_cached_md_v1');
            localStorage.removeItem('cookbook_cached_md_v2');
            const rawCache = localStorage.getItem(CACHED_RECIPES_KEY);
            if (rawCache) {
                const cacheObj = JSON.parse(rawCache);
                const cachedTime = (cacheObj && cacheObj.syncedAt) ? Date.parse(cacheObj.syncedAt) : 0;
                if (cacheObj && Array.isArray(cacheObj.items) && cacheObj.items.length > 0 && cachedTime > bundledTime) {
                    initialItems = cacheObj.items;
                    activeContentHash = cacheObj.contentHash || computeRecipesHash(cacheObj.items);
                    activeImageHashes = (cacheObj.imageHashes && typeof cacheObj.imageHashes === 'object')
                        ? { ...bundledImgHashes, ...cacheObj.imageHashes }
                        : bundledImgHashes;
                    activeSyncCommitSha = cacheObj.commitSha || '';
                    activeCommitEtag = cacheObj.commitEtag || '';
                } else {
                    localStorage.removeItem(CACHED_RECIPES_KEY);
                }
            }
        } catch (_) {}

        // 1) Instant 0ms local render (never blocks on network; works 100% offline)
        if (initialItems.length > 0) {
            applyRecipeItemsToUI(initialItems, false);
        }

        // 2) Immediately check web on startup and apply changes if any
        syncRecipesFromGitHub(false, 'startup');
    }

    async function fetchRemotePayloadViaGitHubApi() {
        const headers = { 'Accept': 'application/vnd.github.v3+json' };
        const token = getGitHubToken();
        if (token) headers['Authorization'] = `token ${token}`;
        if (activeCommitEtag && activeSyncCommitSha) {
            headers['If-None-Match'] = activeCommitEtag;
        }

        const commitRes = await fetchWithTimeout(
            `https://api.github.com/repos/${GITHUB_REPO}/commits/${GITHUB_BRANCH}`,
            { cache: 'no-store', headers }
        );

        // 304 Not Modified = zero rate-limit cost & guaranteed zero changes on main!
        if (commitRes.status === 304) {
            return { notModified: true, commitSha: activeSyncCommitSha, commitEtag: activeCommitEtag };
        }
        if (!commitRes.ok) {
            throw new Error(`GitHub API HTTP ${commitRes.status}`);
        }

        const newEtag = commitRes.headers.get('etag') || '';
        const commitJson = await commitRes.json();
        const refSha = (commitJson && commitJson.sha) ? commitJson.sha : '';
        if (!refSha) throw new Error('Missing commit SHA');

        if (activeSyncCommitSha && refSha === activeSyncCommitSha) {
            return { notModified: true, commitSha: refSha, commitEtag: newEtag || activeCommitEtag };
        }

        // Check if head commit edited recipe/*.md directly without regenerating docs/recipes-manifest.json
        const changedFiles = Array.isArray(commitJson.files) ? commitJson.files : [];
        const touchedRecipeMd = changedFiles.some(f =>
            f && f.filename && f.filename.endsWith('.md') &&
            (f.filename.startsWith('recipe/') || f.filename.startsWith('recipes/'))
        );
        const touchedManifest = changedFiles.some(f => f && f.filename === 'docs/recipes-manifest.json');

        // Fast path: 1 single immutable-SHA manifest fetch (no CDN lag, no rate limit)
        if (!(touchedRecipeMd && !touchedManifest)) {
            const manifestRes = await fetchWithTimeout(
                `https://raw.githubusercontent.com/${GITHUB_REPO}/${refSha}/docs/recipes-manifest.json`,
                { cache: 'no-store' }
            );
            if (manifestRes.ok) {
                const manifest = await manifestRes.json();
                if (manifest && Array.isArray(manifest.items) && manifest.items.length > 0) {
                    return {
                        notModified: false,
                        commitSha: refSha,
                        commitEtag: newEtag,
                        items: manifest.items,
                        contentHash: manifest.contentHash || computeRecipesHash(manifest.items),
                        imageHashes: manifest.imageHashes || {}
                    };
                }
            }
        }

        // Direct GitHub web-editor path: fetch full tree + raw markdown blobs at exact refSha
        const treeHeaders = { 'Accept': 'application/vnd.github.v3+json' };
        if (token) treeHeaders['Authorization'] = `token ${token}`;
        const treeRes = await fetchWithTimeout(
            `https://api.github.com/repos/${GITHUB_REPO}/git/trees/${refSha}?recursive=1`,
            { cache: 'no-store', headers: treeHeaders }
        );
        if (!treeRes.ok) throw new Error(`Tree HTTP ${treeRes.status}`);
        const treeData = await treeRes.json();

        const recipeFiles = (treeData.tree || []).filter(item =>
            item.type === 'blob' &&
            item.path.endsWith('.md') &&
            (item.path.startsWith('recipe/') || item.path.startsWith('recipes/'))
        );
        if (recipeFiles.length === 0) throw new Error('No recipe markdown files found');

        const fetchedRaw = await Promise.all(recipeFiles.map(async file => {
            const rawUrl = `https://raw.githubusercontent.com/${GITHUB_REPO}/${refSha}/${file.path}`;
            const res = await fetchWithTimeout(rawUrl, { cache: 'no-store' });
            if (!res.ok) return null;
            const content = (await res.text()).replace(/\r\n/g, '\n');
            return { path: file.path, content };
        }));

        const validItems = fetchedRaw.filter(Boolean);
        if (validItems.length === 0) throw new Error('Failed to fetch raw markdown files');
        validItems.sort((a, b) => a.path.localeCompare(b.path));

        return {
            notModified: false,
            commitSha: refSha,
            commitEtag: newEtag,
            items: validItems,
            contentHash: computeRecipesHash(validItems),
            imageHashes: activeImageHashes
        };
    }

    async function fetchRemotePayloadViaPagesManifest() {
        const res = await fetchWithTimeout(
            `${PAGES_BASE_URL}/recipes-manifest.json?t=${Date.now()}`,
            { cache: 'no-store' }
        );
        if (!res.ok) throw new Error(`Pages Manifest HTTP ${res.status}`);
        const manifest = await res.json();
        if (!manifest || !Array.isArray(manifest.items) || manifest.items.length === 0) {
            throw new Error('Invalid manifest payload');
        }
        return {
            notModified: false,
            commitSha: '',
            commitEtag: '',
            items: manifest.items,
            contentHash: manifest.contentHash || computeRecipesHash(manifest.items),
            imageHashes: manifest.imageHashes || {}
        };
    }

    async function syncRecipesFromGitHub(manualTrigger = false, reason = 'manual') {
        if (isSyncingRecipes) return;
        const now = Date.now();
        if (!manualTrigger && (now - lastAutoSyncMs) < AUTO_SYNC_COOLDOWN_MS) {
            return;
        }
        isSyncingRecipes = true;
        if (!manualTrigger) lastAutoSyncMs = now;

        setSyncPillState('syncing', '웹 변경 확인 중...', '🔄');

        try {
            let remotePayload = null;
            try {
                // Channel 1: Instant Commit-SHA sync (0.1s after push, ETag 0-quota check)
                remotePayload = await fetchRemotePayloadViaGitHubApi();
            } catch (_) {
                // Channel 2: Unlimited GitHub Pages CDN manifest fallback (immune to API rate limits)
                remotePayload = await fetchRemotePayloadViaPagesManifest();
            }

            if (remotePayload.notModified) {
                if (remotePayload.commitSha) activeSyncCommitSha = remotePayload.commitSha;
                if (remotePayload.commitEtag) activeCommitEtag = remotePayload.commitEtag;
                setSyncPillState('synced', `최신 상태 (${allRecipes.length}개)`, '✓');
                if (manualTrigger) {
                    showToast(`✅ 웹과 동일한 최신 레시피 상태입니다 (${allRecipes.length}개)`);
                }
                return;
            }

            const remoteHash = remotePayload.contentHash || computeRecipesHash(remotePayload.items);
            const mergedImgHashes = {
                ...(window.BUNDLED_IMAGE_HASHES || {}),
                ...(remotePayload.imageHashes || {})
            };
            const imagesChanged = JSON.stringify(mergedImgHashes) !== JSON.stringify(activeImageHashes);
            const recipesChanged = remoteHash !== activeContentHash;

            if (remotePayload.commitSha) activeSyncCommitSha = remotePayload.commitSha;
            if (remotePayload.commitEtag) activeCommitEtag = remotePayload.commitEtag;
            activeImageHashes = mergedImgHashes;
            activeContentHash = remoteHash;

            // Persist latest synced version to localStorage so even future offline launches show this updated version
            try {
                localStorage.setItem(CACHED_RECIPES_KEY, JSON.stringify({
                    syncedAt: new Date().toISOString(),
                    commitSha: activeSyncCommitSha,
                    commitEtag: activeCommitEtag,
                    contentHash: activeContentHash,
                    imageHashes: activeImageHashes,
                    items: remotePayload.items
                }));
            } catch (_) {}

            if (recipesChanged || imagesChanged) {
                applyRecipeItemsToUI(remotePayload.items, true);
                setSyncPillState('updated', `웹 변경 반영됨 (${allRecipes.length}개)`, '🟢');
                showToast(`🔄 웹에서 변경된 최신 레시피(${allRecipes.length}개)가 반영되었습니다!`);
            } else {
                setSyncPillState('synced', `최신 상태 (${allRecipes.length}개)`, '✓');
                if (manualTrigger) {
                    showToast(`✅ 이미 최신 레시피 상태입니다 (${allRecipes.length}개)`);
                }
            }
        } catch (err) {
            // Sync failed (offline / timeout / server unreachable) -> keep existing local recipes untouched!
            setSyncPillState('offline', `로컬 보관본 (${allRecipes.length}개)`, '📦');
            if (manualTrigger) {
                showToast('📦 오프라인 상태입니다. 기기에 저장된 레시피를 표시합니다.');
            }
            if (allRecipes.length === 0) {
                grid.innerHTML = `<div class="status-message"><p>네트워크 연결을 확인해 주세요.</p></div>`;
            }
        } finally {
            isSyncingRecipes = false;
        }
    }

    // =========================================================================
    // 5. FILTERING, RENDERING & INTERACTIVE MODAL
    // =========================================================================

    function setupFilterTabs() {
        const categories = Array.from(new Set(allRecipes.map(r => r.category))).filter(Boolean);
        let catHtml = `<button class="category-tab ${currentCategory === 'all' ? 'active' : ''}" onclick="filterByCategory('all')">전체 (${allRecipes.length})</button>`;
        categories.forEach(cat => {
            const count = allRecipes.filter(r => r.category === cat).length;
            catHtml += `<button class="category-tab ${currentCategory === cat ? 'active' : ''}" onclick="filterByCategory('${cat}')">${cat} (${count})</button>`;
        });
        categoryTabsContainer.innerHTML = catHtml;

        const verifiedCount = allRecipes.filter(r => r.status === 'verified').length;
        const needsFixCount = allRecipes.filter(r => r.status === 'needs_fix').length;
        const unverifiedCount = allRecipes.filter(r => r.status === 'unverified').length;

        statusTabsContainer.innerHTML = `
            <button class="status-tab ${currentStatus === 'all' ? 'active' : ''}" data-status="all" onclick="filterByStatus('all')">전체 상태</button>
            <button class="status-tab ${currentStatus === 'verified' ? 'active' : ''}" data-status="verified" onclick="filterByStatus('verified')">✅ 검증 완료 (${verifiedCount})</button>
            <button class="status-tab ${currentStatus === 'needs_fix' ? 'active' : ''}" data-status="needs_fix" onclick="filterByStatus('needs_fix')">⚠️ 수정 필요 (${needsFixCount})</button>
            <button class="status-tab ${currentStatus === 'unverified' ? 'active' : ''}" data-status="unverified" onclick="filterByStatus('unverified')">⚪ 미검증 (${unverifiedCount})</button>
        `;
    }

    function filterByCategory(cat) {
        currentCategory = cat;
        setupFilterTabs();
        applyFilter();
    }

    function filterByStatus(status) {
        currentStatus = status;
        setupFilterTabs();
        applyFilter();
    }

    function applyFilter() {
        const query = searchInput.value.toLowerCase().trim();
        const recentViews = getRecentViewsMap();

        const filtered = allRecipes.filter(r => {
            const matchCategory = currentCategory === 'all' || r.category === currentCategory;
            const matchStatus = currentStatus === 'all' || r.status === currentStatus;
            const matchSearch = !query ||
                r.title.toLowerCase().includes(query) ||
                r.description.toLowerCase().includes(query) ||
                (r.comment && r.comment.toLowerCase().includes(query)) ||
                r.ingredients.some(i => i.name.toLowerCase().includes(query)) ||
                r.rawMarkdown.toLowerCase().includes(query);
            return matchCategory && matchStatus && matchSearch;
        });

        // Sort recipes viewed for >= 30 seconds to the very top by most recent view timestamp
        filtered.sort((a, b) => {
            const ta = recentViews[a.id] || 0;
            const tb = recentViews[b.id] || 0;
            if (tb !== ta) return tb - ta;
            return 0;
        });

        renderRecipes(filtered, recentViews);
    }

    searchInput.addEventListener('input', applyFilter);

    function renderRecipes(items, recentViews = getRecentViewsMap()) {
        if (items.length === 0) {
            grid.innerHTML = `
                <div class="status-message" style="grid-column: 1 / -1;">
                    <p>🔍 조건에 맞는 레시피가 없습니다.</p>
                </div>`;
            return;
        }

        grid.innerHTML = items.map(recipe => {
            const statusBadgeHtml = recipe.status === 'verified'
                ? `<span class="card-status-badge status-verified">✓ 검증 완료</span>`
                : (recipe.status === 'needs_fix'
                    ? `<span class="card-status-badge status-needs_fix">! 수정 필요</span>`
                    : '');

            const commentHtml = recipe.comment
                ? `<div class="card-comment-snippet">💬 ${recipe.comment}</div>`
                : '';

            const variationCount = (recipe.modes ? recipe.modes.length : 0) + (recipe.addons ? recipe.addons.length : 0);
            const isRecent = !!recentViews[recipe.id];
            const miniPillsHtml = (isRecent || variationCount > 0) ? `
                <div class="card-meta-pills">
                    ${isRecent ? `<span class="card-mini-pill pill-recent">🕘 최근 조회</span>` : ''}
                    ${variationCount > 0 ? `<span class="card-mini-pill pill-variation">🎛️ 베리에이션 ${variationCount}종</span>` : ''}
                </div>
            ` : '';

            const totalTimers = recipe.steps.reduce((acc, s) => acc + s.timers.length, 0);

            const cardMediaHtml = recipe.heroImage
                ? `<img class="card-hero-img" src="${recipe.heroImage}" alt="${recipe.title.replace(/"/g, '&quot;')}" loading="lazy" onerror="handleRecipeImgError(this, '${recipe.icon}')">`
                : `${recipe.icon}`;

            return `
                <div class="recipe-card" onclick="openRecipe('${recipe.id.replace(/'/g, "\\'")}')">
                    <div class="card-image">
                        ${cardMediaHtml}
                        ${statusBadgeHtml}
                        <span class="card-badge">${recipe.category}</span>
                    </div>
                    <div class="card-content">
                        <div>
                            ${miniPillsHtml}
                            <h3>${recipe.title}</h3>
                            <p>${recipe.description}</p>
                            ${commentHtml}
                        </div>
                        <div class="card-info">
                            <span>👥 기본 ${recipe.baseServings}인분</span>
                            <span>🕒 ${recipe.time}</span>
                            ${totalTimers > 0 ? `<span>⏱️ 타이머 ${totalTimers}개</span>` : `<span>📊 ${recipe.difficulty}</span>`}
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function getEffectiveRecipeView(recipe) {
        if (activeVariationMode !== 'base') {
            const mode = (recipe.modes || []).find(m => m.id === activeVariationMode);
            if (mode) {
                return {
                    ingredients: mode.ingredients.length > 0 ? mode.ingredients : recipe.ingredients,
                    steps: mode.steps.length > 0 ? mode.steps : recipe.steps,
                    notesHtml: mode.descriptionHtml ? `<strong>${mode.title}:</strong> ${mode.descriptionHtml}` : ''
                };
            }
        }

        const mergedIngredients = [...recipe.ingredients];
        const mergedSteps = recipe.steps.map(s => ({ ...s }));
        const selectedNotes = [];

        for (const addon of (recipe.addons || [])) {
            if (!activeAddonIds.has(addon.id)) continue;
            if (addon.descriptionHtml) {
                selectedNotes.push(`<strong>➕ ${addon.title}:</strong> ${addon.descriptionHtml}`);
            }
            for (const ing of addon.ingredients) {
                mergedIngredients.push({
                    ...ing,
                    isAddon: true,
                    addonTitle: addon.title
                });
            }
            for (const st of addon.steps) {
                mergedSteps.push({
                    ...st,
                    index: mergedSteps.length + 1,
                    isAddon: true,
                    addonTitle: addon.title
                });
            }
        }

        return {
            ingredients: mergedIngredients,
            steps: mergedSteps,
            notesHtml: selectedNotes.join('<br style="margin-bottom:0.35rem;">')
        };
    }

    function renderIngredientsHtml(recipe, targetServings, smartEnabled) {
        const rawRatio = targetServings / (recipe.baseServings || 1);
        let anySmartAdjusted = false;
        const { ingredients: effectiveIngredients } = getEffectiveRecipeView(recipe);

        const itemsHtml = effectiveIngredients.map(ing => {
            const { factor, reason } = getSmartScaleFactor(ing.role, rawRatio, smartEnabled);
            const scaledAmt = scaleAmountText(ing.amount, factor);
            const isNonLinearAdjusted = reason && Math.abs(factor - rawRatio) / Math.max(0.1, rawRatio) >= 0.05 && /\d/.test(ing.amount);
            if (isNonLinearAdjusted) anySmartAdjusted = true;

            const ratioDiffText = isNonLinearAdjusted
                ? `<span class="smart-adj-badge">${reason} (${rawRatio.toFixed(1).replace(/\.0$/, '')}배 → ${factor.toFixed(2).replace(/0$/, '').replace(/\.$/, '')}배)</span>`
                : '';

            const addonBadgeHtml = ing.isAddon
                ? `<span class="addon-ing-badge">➕ 옵션 추가</span>`
                : '';

            const noteHtml = ing.note ? `<span>${ing.note}</span>` : '<span></span>';
            const rightBadges = [addonBadgeHtml, ratioDiffText].filter(Boolean).join(' ');

            return `
                <li class="${ing.isAddon ? 'addon-ing-item' : (isNonLinearAdjusted ? 'scaled-highlight' : '')}">
                    <div class="ing-row-main">
                        <span class="ing-name">${ing.name}</span>
                        <span class="ing-amount">${scaledAmt}</span>
                    </div>
                    ${(ing.note || rightBadges) ? `
                    <div class="ing-meta-row">
                        ${noteHtml}
                        <span>${rightBadges}</span>
                    </div>` : ''}
                </li>
            `;
        }).join('');

        return { itemsHtml, anySmartAdjusted, rawRatio };
    }

    function renderStepsHtml(recipe) {
        const { steps: effectiveSteps } = getEffectiveRecipeView(recipe);
        return effectiveSteps.map(step => {
            const addonPrefix = step.isAddon
                ? `<span class="addon-ing-badge" style="margin-right:0.35rem; vertical-align:middle;">➕ ${step.addonTitle}</span>`
                : '';
            const stepImagesHtml = (step.images && step.images.length > 0)
                ? step.images.map(img => {
                    const safeSrc = img.src.replace(/'/g, "\\'");
                    const safeAlt = (img.alt || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    return `
                        <div class="step-guide-figure" onclick="openImageLightboxFromContainer(this, '${safeSrc}', '${safeAlt}', event)">
                            <img src="${img.src}" alt="${safeAlt}" loading="lazy" onerror="handleRecipeImgError(this, '')">
                            <div class="step-guide-caption">
                                <span>🎨 조리 포인트 그림 · ${img.alt}</span>
                                <span style="font-weight:500; opacity:0.75;">🔍 크게 보기</span>
                            </div>
                        </div>
                    `;
                }).join('')
                : '';

            return `
                <div class="step-item ${step.isAddon ? 'addon-step-item' : ''}" onclick="toggleStep(this)">
                    <div class="step-checkbox">✓</div>
                    <div class="step-content-col">
                        <div class="step-text">
                            ${addonPrefix}<strong>Step ${step.index}. ${step.titleHtml}</strong><br>
                            ${step.bodyHtml}
                        </div>
                        ${stepImagesHtml}
                        ${step.timers.length > 0 ? `
                        <div class="step-timers-bar">
                            ${step.timers.map(tm => `
                                <button class="step-timer-pill" onclick="startCookingTimer(${tm.seconds}, '${(recipe.title + ' · ' + tm.label).replace(/'/g, "\\'")}', event)">
                                    ⏱️ ${tm.display} 타이머 시작
                                </button>
                            `).join('')}
                        </div>` : ''}
                    </div>
                </div>
            `;
        }).join('');
    }

    function refreshModalVariationSections() {
        const recipe = allRecipes.find(r => r.id === activeRecipeId);
        if (!recipe) return;

        // Update mode tabs active state
        document.querySelectorAll('.variation-mode-btn[data-mode-id]').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('data-mode-id') === activeVariationMode);
        });

        // Show/hide add-on chips bar depending on whether base mode is selected
        const addonsWrap = document.getElementById('variation-addons-wrap');
        if (addonsWrap) {
            addonsWrap.style.display = (activeVariationMode === 'base' && recipe.addons && recipe.addons.length > 0) ? 'block' : 'none';
        }
        document.querySelectorAll('.variation-addon-chip[data-addon-id]').forEach(chip => {
            const id = chip.getAttribute('data-addon-id');
            const isActive = activeAddonIds.has(id);
            chip.classList.toggle('active', isActive);
            const iconSpan = chip.querySelector('.addon-check-icon');
            if (iconSpan) iconSpan.textContent = isActive ? '✓' : '+';
        });

        // Update description box
        const { notesHtml } = getEffectiveRecipeView(recipe);
        const descBox = document.getElementById('variation-desc-box');
        if (descBox) {
            if (notesHtml) {
                descBox.innerHTML = notesHtml;
                descBox.classList.add('visible');
            } else {
                descBox.innerHTML = '';
                descBox.classList.remove('visible');
            }
        }

        // Re-render scaled ingredients & banner
        updateServingPortion(currentServings);

        // Re-render steps list + timers
        const stepsListEl = document.getElementById('modal-steps-list');
        if (stepsListEl) {
            stepsListEl.innerHTML = renderStepsHtml(recipe);
        }
    }

    function selectVariationMode(modeId) {
        activeVariationMode = modeId;
        refreshModalVariationSections();
    }

    function toggleVariationAddon(addonId) {
        if (activeAddonIds.has(addonId)) {
            activeAddonIds.delete(addonId);
        } else {
            activeAddonIds.add(addonId);
        }
        refreshModalVariationSections();
    }

    function updateServingPortion(newServings) {
        const recipe = allRecipes.find(r => r.id === activeRecipeId);
        if (!recipe) return;

        const parsed = parseFloat(newServings);
        if (isNaN(parsed) || parsed < 0.5) return;
        currentServings = Math.min(20, Math.round(parsed * 2) / 2);

        const inputEl = document.getElementById('serving-number-input');
        if (inputEl && document.activeElement !== inputEl) {
            inputEl.value = currentServings;
        }
        const minusBtn = document.getElementById('serving-minus-btn');
        if (minusBtn) minusBtn.disabled = currentServings <= 0.5;

        // Update preset chips active state
        document.querySelectorAll('.preset-chip[data-servings]').forEach(chip => {
            const val = parseFloat(chip.getAttribute('data-servings'));
            chip.classList.toggle('active', Math.abs(val - currentServings) < 0.01);
        });

        // Re-render ingredients list & smart banner
        const { itemsHtml, anySmartAdjusted, rawRatio } = renderIngredientsHtml(recipe, currentServings, smartScaleEnabled);
        const listEl = document.getElementById('scaled-ingredients-list');
        if (listEl) listEl.innerHTML = itemsHtml;

        const bannerEl = document.getElementById('smart-scale-banner');
        if (bannerEl) {
            if (anySmartAdjusted && smartScaleEnabled) {
                bannerEl.classList.add('visible');
                bannerEl.innerHTML = `💡 <strong>스마트 양념 보정 적용 중 (${recipe.baseServings}인분 → ${currentServings}인분):</strong> 주재료는 정확히 <strong>${Number(rawRatio.toFixed(2))}배</strong>로 변경하고, 짜지거나 기름지지 않도록 <strong>소금·간장·고추장(염도), 팬 코팅 식용유, 국물 증발량</strong>은 요리 비율에 맞춰 자동 보정했습니다.`;
            } else {
                bannerEl.classList.remove('visible');
            }
        }
    }

    function changeServingDelta(delta) {
        const step = (currentServings <= 1 && delta < 0) ? 0.5 : (currentServings === 0.5 && delta > 0 ? 0.5 : 1);
        const next = currentServings + (delta > 0 ? step : -step);
        const clamped = Math.max(0.5, Math.min(20, next));
        const inputEl = document.getElementById('serving-number-input');
        if (inputEl) inputEl.value = clamped;
        updateServingPortion(clamped);
    }

    function toggleSmartScale(checked) {
        smartScaleEnabled = checked;
        updateServingPortion(currentServings);
    }

    function openRecipe(id, pushHistory = true) {
        const recipe = allRecipes.find(r => r.id === id);
        if (!recipe) return;

        const isSameAlreadyOpen = activeRecipeId === id && modal.classList.contains('active');
        activeRecipeId = id;
        if (!isSameAlreadyOpen) {
            activeVariationMode = 'base';
            activeAddonIds = new Set();
            currentServings = recipe.baseServings || 1;
            startRecipeViewTracker(id);
        }

        const cleanedMd = recipe.rawMarkdown
            .replace(/^>\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*$/gm, (_, type) => {
                const labelMap = { NOTE: '📌 참고', TIP: '💡 팁', IMPORTANT: '⭐ 핵심 체크', WARNING: '⚠️ 주의', CAUTION: '🚨 주의' };
                return `> **${labelMap[type] || type}**`;
            })
            .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, alt, url) => `![${alt}](${resolveRecipeImageUrl(url)})`);
        const renderedMarkdown = typeof marked !== 'undefined' ? marked.parse(cleanedMd, { breaks: true }) : '';
        const { itemsHtml } = renderIngredientsHtml(recipe, currentServings, smartScaleEnabled);
        const stepsHtml = renderStepsHtml(recipe);
        const hasModes = recipe.modes && recipe.modes.length > 0;
        const hasAddons = recipe.addons && recipe.addons.length > 0;
        const hasVariations = hasModes || hasAddons;
        const escapedId = recipe.id.replace(/'/g, "\\'");

        const variationSelectorHtml = hasVariations ? `
            <div class="variation-selector-card">
                <div class="variation-header">
                    <h4>🎛️ 베리에이션 & 조리 방식 선택</h4>
                    <span class="variation-subhint">선택에 맞춰 재료·인분·조리 순서가 자동 반영됩니다</span>
                </div>
                ${hasModes ? `
                <div class="variation-mode-tabs">
                    <button class="variation-mode-btn ${activeVariationMode === 'base' ? 'active' : ''}" data-mode-id="base" onclick="selectVariationMode('base')">
                        ✨ 기본 조리
                    </button>
                    ${recipe.modes.map(m => `
                        <button class="variation-mode-btn ${activeVariationMode === m.id ? 'active' : ''}" data-mode-id="${m.id}" onclick="selectVariationMode('${m.id}')">
                            ${m.title}
                        </button>
                    `).join('')}
                </div>` : ''}
                ${hasAddons ? `
                <div id="variation-addons-wrap" class="variation-addons-wrap" style="${hasModes ? '' : 'margin-top:0; padding-top:0; border-top:none;'} ${activeVariationMode !== 'base' ? 'display:none;' : ''}">
                    <span class="variation-addons-label">➕ 취향대로 추가/제외 옵션 (중복 선택 가능)</span>
                    <div class="variation-addons-chips">
                        ${recipe.addons.map(a => {
                            const active = activeAddonIds.has(a.id);
                            return `
                                <button class="variation-addon-chip ${active ? 'active' : ''}" data-addon-id="${a.id}" onclick="toggleVariationAddon('${a.id}')">
                                    <span class="addon-check-icon">${active ? '✓' : '+'}</span> ${a.title}
                                </button>
                            `;
                        }).join('')}
                    </div>
                </div>` : ''}
                <div id="variation-desc-box" class="variation-desc-box"></div>
            </div>
        ` : '';

        const heroBannerHtml = recipe.heroImage ? `
            <div class="modal-hero-banner" onclick="openImageLightboxFromContainer(this, '${recipe.heroImage.replace(/'/g, "\\'")}', '${(recipe.heroImageAlt || recipe.title).replace(/'/g, "\\'").replace(/"/g, '&quot;')}', event)">
                <img src="${recipe.heroImage}" alt="${recipe.title.replace(/"/g, '&quot;')}" onerror="handleRecipeImgError(this, '')">
            </div>
        ` : '';

        modalBody.innerHTML = `
            <div class="recipe-header">
                <h2>${recipe.icon} ${recipe.title}</h2>
                <p>${recipe.description}</p>
                <div id="modal-status-badge-container" style="margin-top: 0.7rem;">
                    ${renderStatusBadgeHtml(recipe.status)}
                </div>
            </div>

            ${heroBannerHtml}

            <div class="recipe-meta">
                <span>👥 <strong>기본 분량:</strong> ${recipe.servings}</span>
                <span>🕒 <strong>소요시간:</strong> ${recipe.time}</span>
                <span>📊 <strong>난이도:</strong> ${recipe.difficulty}</span>
                <span>🍽️ <strong>분류:</strong> ${recipe.category}</span>
            </div>

            ${variationSelectorHtml}

            <!-- SMART SERVING & PORTION CALCULATOR -->
            ${(recipe.ingredients.length > 0 || hasVariations) ? `
            <div class="serving-calculator-card">
                <div class="serving-top-row">
                    <div class="serving-title-group">
                        <h4>⚖️ 인분 조절 & 재료 자동 계량</h4>
                        <span class="serving-base-hint">레시피 기준: ${recipe.baseServings}인분 · 인분을 바꾸면 양념 비율이 알맞게 자동 조정됩니다</span>
                    </div>
                    <div class="serving-stepper">
                        <button id="serving-minus-btn" class="stepper-btn" onclick="changeServingDelta(-1)" ${currentServings <= 0.5 ? 'disabled' : ''}>−</button>
                        <input id="serving-number-input" type="number" step="0.5" min="0.5" max="20" class="serving-input" value="${currentServings}" oninput="updateServingPortion(this.value)">
                        <span class="serving-unit-label">인분</span>
                        <button class="stepper-btn" onclick="changeServingDelta(1)">+</button>
                    </div>
                </div>
                <div class="serving-presets-row">
                    <div class="preset-chips">
                        ${[1, 2, 3, 4].map(n => `
                            <button class="preset-chip ${currentServings === n ? 'active' : ''}" data-servings="${n}" onclick="document.getElementById('serving-number-input').value=${n}; updateServingPortion(${n});">
                                ${n}인분${n === recipe.baseServings ? ' (기본)' : ''}
                            </button>
                        `).join('')}
                    </div>
                    <label class="smart-scale-toggle">
                        <input type="checkbox" ${smartScaleEnabled ? 'checked' : ''} onchange="toggleSmartScale(this.checked)">
                        🧠 스마트 양념 보정
                    </label>
                </div>
                <div id="smart-scale-banner" class="smart-scale-banner"></div>
            </div>

            <div class="recipe-section">
                <div class="recipe-section-header">
                    <h4>🛒 필요 재료</h4>
                </div>
                <ul id="scaled-ingredients-list" class="ingredients-list">
                    ${itemsHtml}
                </ul>
            </div>` : ''}

            ${(recipe.steps.length > 0 || hasVariations) ? `
            <div class="recipe-section">
                <div class="recipe-section-header">
                    <h4>🔥 조리 순서 & 타이머</h4>
                    <button class="custom-timer-trigger" onclick="openCustomTimerPrompt()">⏱️ + 직접 타이머 설정</button>
                </div>
                <div id="modal-steps-list" class="steps-list">
                    ${stepsHtml}
                </div>
            </div>` : ''}

            <div id="modal-comment-box-container">
                ${recipe.comment ? `
                <div class="recipe-comment-box">
                    <span>📝</span>
                    <div>
                        <strong>나만의 조리 메모:</strong><br>
                        ${recipe.comment}
                    </div>
                </div>` : ''}
            </div>

            <!-- Interactive Status & Comment Panel -->
            <div class="interactive-status-panel">
                <h4>
                    <span>🏷️ 내 검증 상태 & 코멘트 기록</span>
                    <span style="display:flex; align-items:center; gap:0.45rem;">
                        <span style="font-size:0.76rem; color:var(--text-muted); font-weight:500;">${getGitHubToken() ? '🟢 GitHub + 기기 저장' : '💾 기기 자동 저장'}</span>
                        <button onclick="configureGitHubToken('${escapedId}')" style="background:none; border:1px solid #D1D5DB; border-radius:6px; padding:0.2rem 0.5rem; font-size:0.74rem; cursor:pointer; color:#4B5563;">
                            ${getGitHubToken() ? 'GitHub 연동됨' : 'GitHub 연동'}
                        </button>
                    </span>
                </h4>

                <div class="status-button-group" id="modal-status-btn-group">
                    <button class="status-btn ${recipe.status === 'unverified' ? 'selected-unverified' : ''}" onclick="updateRecipeStatus('${escapedId}', 'unverified')">⚪ 미검증</button>
                    <button class="status-btn ${recipe.status === 'verified' ? 'selected-verified' : ''}" onclick="updateRecipeStatus('${escapedId}', 'verified')">✅ 검증 완료</button>
                    <button class="status-btn ${recipe.status === 'needs_fix' ? 'selected-needs_fix' : ''}" onclick="updateRecipeStatus('${escapedId}', 'needs_fix')">⚠️ 수정 필요</button>
                </div>

                <div class="comment-editor-wrapper">
                    <input type="text" id="recipe-comment-input" class="comment-input" placeholder="간 조절이나 다음번 조리 메모를 남겨보세요..." value="${recipe.comment ? recipe.comment.replace(/"/g, '&quot;') : ''}" onkeydown="if(event.key==='Enter') saveRecipeComment('${escapedId}')">
                    <button class="save-comment-btn" onclick="saveRecipeComment('${escapedId}')">저장</button>
                </div>
            </div>

            <div class="recipe-section">
                <details class="raw-md-details">
                    <summary>📖 레시피 원문 및 꿀팁 전체 보기 <span>▾</span></summary>
                    <div class="recipe-rendered-body">
                        ${renderedMarkdown}
                    </div>
                </details>
            </div>

            <div class="recipe-footer-actions">
                <a href="https://github.com/${GITHUB_REPO}/blob/${GITHUB_BRANCH}/${recipe.path}" target="_blank">
                    GitHub 원본 파일 보기 (${recipe.path})
                </a>
            </div>
        `;

        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
        updateWakeLockButtonUI();

        if (pushHistory) {
            try {
                history.pushState({ modalOpen: true, recipeId: id }, '');
            } catch (_) {}
        }
    }

    // =========================================================================
    // 6. LOCAL STORAGE & GITHUB DIRECT SYNC HELPERS
    // =========================================================================

    function getLocalRecipeState(recipeId) {
        try {
            const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
            if (!raw) return null;
            const map = JSON.parse(raw);
            return map[recipeId] || null;
        } catch (e) {
            return null;
        }
    }

    function saveLocalRecipeState(recipeId, status, comment) {
        try {
            const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
            const map = raw ? JSON.parse(raw) : {};
            map[recipeId] = { status, comment, updatedAt: new Date().toISOString() };
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(map));
        } catch (e) {
            console.error('Failed to save to localStorage:', e);
        }
    }

    function getGitHubToken() {
        return localStorage.getItem(GITHUB_TOKEN_KEY) || '';
    }

    function configureGitHubToken(currentRecipeId) {
        const current = getGitHubToken();
        const input = prompt(
            'GitHub Personal Access Token을 입력하면 상태/코멘트 변경 시 GitHub의 마크다운(.md) 원본도 자동 업데이트됩니다.\n(비워두고 확인을 누르면 기기 저장 모드로 전환됩니다.)',
            current
        );
        if (input === null) return;
        const trimmed = input.trim();
        if (trimmed) {
            localStorage.setItem(GITHUB_TOKEN_KEY, trimmed);
            showToast('GitHub 연동이 설정되었습니다!');
        } else {
            localStorage.removeItem(GITHUB_TOKEN_KEY);
            showToast('기기 저장 모드로 전환되었습니다.');
        }
        if (currentRecipeId) openRecipe(currentRecipeId, false);
    }

    function renderStatusBadgeHtml(status) {
        if (status === 'verified') {
            return '<span class="card-status-badge status-verified" style="position:static;">✓ 검증 완료</span>';
        } else if (status === 'needs_fix') {
            return '<span class="card-status-badge status-needs_fix" style="position:static;">! 수정 필요</span>';
        }
        return '<span class="card-status-badge status-unverified" style="position:static;">⚪ 미검증</span>';
    }

    let toastTimer = null;
    function showToast(message) {
        const toast = document.getElementById('toast-notify');
        const text = document.getElementById('toast-text');
        if (!toast || !text) return;
        text.textContent = message;
        toast.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
            toast.classList.remove('show');
        }, 2600);
    }

    function updateMarkdownStatusAndComment(mdContent, statusText, comment) {
        let updated = mdContent;
        if (/^[*-]?\s*\*\*?(?:검증\s*상태|검증|상태|status)[^*:\n]*[:*]+\s*([^\n\r]*)/im.test(updated)) {
            updated = updated.replace(
                /^([*-]?\s*\*\*?(?:검증\s*상태|검증|상태|status)[^*:\n]*[:*]+)[ \t]*([^\n\r]*)/im,
                `$1 ${statusText}`
            );
        }
        if (/^[*-]?\s*\*\*?(?:코멘트|메모|피드백|노트|comment)[^*:\n\r]*[:*]+[ \t]*([^\r\n]*)/im.test(updated)) {
            updated = updated.replace(
                /^([*-]?\s*\*\*?(?:코멘트|메모|피드백|노트|comment)[^*:\n\r]*[:*]+)[ \t]*([^\r\n]*)/im,
                comment ? `$1 ${comment}` : `$1 `
            );
        }
        return updated;
    }

    async function syncRecipeToGitHub(recipe) {
        const token = getGitHubToken();
        if (!token) return false;
        try {
            const apiUrl = `https://api.github.com/repos/${GITHUB_REPO}/contents/${recipe.path}?ref=${GITHUB_BRANCH}`;
            const getRes = await fetch(apiUrl, {
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });
            if (!getRes.ok) throw new Error(`조회 실패 (${getRes.status})`);
            const fileData = await getRes.json();

            const updatedMd = updateMarkdownStatusAndComment(recipe.rawMarkdown, recipe.statusText, recipe.comment);
            recipe.rawMarkdown = updatedMd;
            const base64Content = btoa(unescape(encodeURIComponent(updatedMd)));

            const putRes = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${recipe.path}`, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    message: `docs(${recipe.title}): 앱/웹에서 상태(${recipe.statusText}) 및 코멘트 업데이트`,
                    content: base64Content,
                    sha: fileData.sha,
                    branch: GITHUB_BRANCH
                })
            });

            if (!putRes.ok) throw new Error(`저장 실패 (${putRes.status})`);
            return true;
        } catch (e) {
            showToast(`⚠️ 기기엔 저장되었으나 GitHub 반영 실패: ${e.message}`);
            return false;
        }
    }

    async function updateRecipeStatus(id, newStatus) {
        const recipe = allRecipes.find(r => r.id === id);
        if (!recipe) return;

        recipe.status = newStatus;
        recipe.statusText = newStatus === 'verified' ? '검증 완료' : (newStatus === 'needs_fix' ? '수정 필요' : '미검증');

        const commentInput = document.getElementById('recipe-comment-input');
        if (commentInput) recipe.comment = commentInput.value.trim();

        saveLocalRecipeState(recipe.id, recipe.status, recipe.comment);

        const badgeContainer = document.getElementById('modal-status-badge-container');
        if (badgeContainer) badgeContainer.innerHTML = renderStatusBadgeHtml(recipe.status);

        const btnGroup = document.getElementById('modal-status-btn-group');
        if (btnGroup) {
            const escapedId = recipe.id.replace(/'/g, "\\'");
            btnGroup.innerHTML = `
                <button class="status-btn ${recipe.status === 'unverified' ? 'selected-unverified' : ''}" onclick="updateRecipeStatus('${escapedId}', 'unverified')">⚪ 미검증</button>
                <button class="status-btn ${recipe.status === 'verified' ? 'selected-verified' : ''}" onclick="updateRecipeStatus('${escapedId}', 'verified')">✅ 검증 완료</button>
                <button class="status-btn ${recipe.status === 'needs_fix' ? 'selected-needs_fix' : ''}" onclick="updateRecipeStatus('${escapedId}', 'needs_fix')">⚠️ 수정 필요</button>
            `;
        }

        setupFilterTabs();
        applyFilter();

        if (getGitHubToken()) {
            const ok = await syncRecipeToGitHub(recipe);
            if (ok) showToast(`✅ '${recipe.statusText}' 상태가 GitHub까지 반영되었습니다!`);
        } else {
            showToast(`상태가 '${recipe.statusText}'(으)로 저장되었습니다!`);
        }
    }

    async function saveRecipeComment(id) {
        const recipe = allRecipes.find(r => r.id === id);
        if (!recipe) return;

        const commentInput = document.getElementById('recipe-comment-input');
        recipe.comment = commentInput ? commentInput.value.trim() : '';

        saveLocalRecipeState(recipe.id, recipe.status, recipe.comment);

        const commentBoxContainer = document.getElementById('modal-comment-box-container');
        if (commentBoxContainer) {
            commentBoxContainer.innerHTML = recipe.comment ? `
                <div class="recipe-comment-box">
                    <span>📝</span>
                    <div>
                        <strong>나만의 조리 메모:</strong><br>
                        ${recipe.comment}
                    </div>
                </div>` : '';
        }

        applyFilter();

        if (getGitHubToken()) {
            const ok = await syncRecipeToGitHub(recipe);
            if (ok) showToast('✅ 코멘트가 GitHub 마크다운까지 저장되었습니다!');
        } else {
            showToast(recipe.comment ? '코멘트가 저장되었습니다!' : '코멘트가 삭제되었습니다.');
        }
    }

    function closeModal(fromPopState = false) {
        if (!modal.classList.contains('active')) return;
        finalizeRecipeViewTracker();
        modal.classList.remove('active');
        document.body.style.overflow = 'auto';
        activeRecipeId = null;
        if (!fromPopState && history.state && history.state.modalOpen) {
            try { history.back(); } catch (_) {}
        }
    }

    window.addEventListener('pagehide', () => {
        finalizeRecipeViewTracker();
    });

    function toggleStep(element) {
        element.classList.toggle('completed');
    }

    window.onclick = function(event) {
        if (event.target === modal) closeModal();
    };

    window.addEventListener('popstate', () => {
        if (modal.classList.contains('active')) {
            closeModal(true);
        }
    });

    window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modal.classList.contains('active')) {
            closeModal();
        }
    });

    // Android Hardware Back Button & Foreground Resume Auto-Sync via Capacitor App plugin
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
        window.Capacitor.Plugins.App.addListener('backButton', ({ canGoBack }) => {
            if (modal.classList.contains('active')) {
                closeModal();
            } else if (canGoBack) {
                window.history.back();
            } else {
                window.Capacitor.Plugins.App.exitApp();
            }
        });

        // 앱을 백그라운드에서 다시 켤 때(기동/전환 시) 웹 변경사항 즉시 체크
        window.Capacitor.Plugins.App.addListener('appStateChange', ({ isActive }) => {
            if (isActive) {
                syncRecipesFromGitHub(false, 'app_resume');
            }
        });
    }

    // 브라우저 탭 복귀 및 네트워크 재연결 시에도 자동 동기화
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
            syncRecipesFromGitHub(false, 'visibility');
        }
    });

    window.addEventListener('online', () => {
        syncRecipesFromGitHub(false, 'network_online');
    });

    // Initialize app immediately with local recipes + instant web diff sync
    loadInitialRecipes();
</script>

</body>
</html>
