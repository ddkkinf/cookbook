    // Identical deterministic hash to scripts/bundle-recipes.mjs
    function computeRecipesHash(items) {
        if (!Array.isArray(items) || items.length === 0) return '0:0:0000000000000000';
        const sorted = [...items]
            .filter(it => it && it.path && typeof it.content === 'string')
            .sort((a, b) => (a.path < b.path ? -1 : (a.path > b.path ? 1 : 0)));
        let h1 = 0x811c9dc5;
        let h2 = 0x01000193;
        let totalLen = 0;
        for (let idx = 0; idx < sorted.length; idx++) {
            const chunk = sorted[idx].path + '\n' + sorted[idx].content.replace(/\r\n/g, '\n');
            totalLen += chunk.length;
            for (let i = 0; i < chunk.length; i++) {
                const c = chunk.charCodeAt(i);
                h1 ^= c;
                h1 = Math.imul(h1, 0x01000193);
                h2 ^= (c + i);
                h2 = Math.imul(h2, 0x85ebca6b);
            }
        }
        const hex1 = (h1 >>> 0).toString(16).padStart(8, '0');
        const hex2 = (h2 >>> 0).toString(16).padStart(8, '0');
        return `${sorted.length}:${totalLen}:${hex1}${hex2}`;
    }

    function setSyncPillState(mode, text, icon = '🔄') {
        const btn = document.getElementById('sync-status-btn');
        const iconEl = document.getElementById('sync-status-icon');
        const labelEl = document.getElementById('sync-status-label');
        if (btn) {
            btn.classList.remove('syncing', 'updated', 'offline');
            if (mode === 'syncing' || mode === 'updated' || mode === 'offline') {
                btn.classList.add(mode);
            }
        }
        if (iconEl) iconEl.textContent = icon;
        if (labelEl) labelEl.textContent = text;
    }

    async function fetchWithTimeout(url, options = {}, timeoutMs = SYNC_TIMEOUT_MS) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs);
        try {
            return await fetch(url, { ...options, signal: controller.signal });
        } finally {
            clearTimeout(timer);
        }
    }

    function applyLocalOverrides(recipes) {
        recipes.forEach(recipe => {
            const localData = getLocalRecipeState(recipe.id);
            if (localData && typeof localData.comment === 'string') {
                recipe.comment = localData.comment;
            }
        });
    }

    function applyRecipeItemsToUI(items, refreshOpenModalIfChanged = false) {
        const prevOpenMd = activeRecipeId
            ? (allRecipes.find(r => r.id === activeRecipeId) || {}).rawMarkdown
            : null;
        const bundledMap = new Map(
            (Array.isArray(window.BUNDLED_RECIPES) ? window.BUNDLED_RECIPES : [])
                .filter(it => it && it.path)
                .map(it => [it.path, it.addedAt || ''])
        );

        const parsed = items.map(item => parseRecipeMarkdown(
            item.content,
            item.path,
            item.addedAt || bundledMap.get(item.path) || ''
        ));
        applyLocalOverrides(parsed);
        allRecipes = parsed;
        setupFilterTabs();
        applyFilter();
        renderHomeDashboard();
        updateGochujangPillsUI();
        if (currentTab === 'settings') {
            renderSettingsView();
        }

        if (refreshOpenModalIfChanged && activeRecipeId && modal.classList.contains('active')) {
            const updatedOpen = allRecipes.find(r => r.id === activeRecipeId);
            if (updatedOpen && updatedOpen.rawMarkdown !== prevOpenMd) {
                if (activeVariationMode !== 'base' && !(updatedOpen.modes || []).some(m => m.id === activeVariationMode)) {
                    activeVariationMode = 'base';
                }
                openRecipe(activeRecipeId, false);
            }
        }
    }

    function loadInitialRecipes() {
        const bundledItems = Array.isArray(window.BUNDLED_RECIPES)
            ? window.BUNDLED_RECIPES.filter(it => it && it.path && typeof it.content === 'string')
            : [];
        const bundledTime = window.BUNDLED_AT ? Date.parse(window.BUNDLED_AT) : 0;
        const bundledHash = window.BUNDLED_HASH || computeRecipesHash(bundledItems);
        const bundledImgHashes = (window.BUNDLED_IMAGE_HASHES && typeof window.BUNDLED_IMAGE_HASHES === 'object')
            ? { ...window.BUNDLED_IMAGE_HASHES }
            : {};

        let initialItems = bundledItems;
        activeContentHash = bundledHash;
        activeImageHashes = bundledImgHashes;
        activeSyncCommitSha = '';
        activeCommitEtag = '';

        // Clean legacy cache keys & load newer synced local copy if available
        try {
            localStorage.removeItem('cookbook_cached_md_v1');
            localStorage.removeItem('cookbook_cached_md_v2');
            localStorage.removeItem('cookbook_cached_md_v3');
            const rawCache = localStorage.getItem(CACHED_RECIPES_KEY);
            if (rawCache) {
                const cacheObj = JSON.parse(rawCache);
                const cachedTime = (cacheObj && cacheObj.syncedAt) ? Date.parse(cacheObj.syncedAt) : 0;
                if (cacheObj && Array.isArray(cacheObj.items) && cacheObj.items.length > 0 && cachedTime > bundledTime) {
                    initialItems = cacheObj.items;
                    activeContentHash = cacheObj.contentHash || computeRecipesHash(cacheObj.items);
                    activeImageHashes = (cacheObj.imageHashes && typeof cacheObj.imageHashes === 'object')
                        ? { ...bundledImgHashes, ...cacheObj.imageHashes }
                        : bundledImgHashes;
                    activeSyncCommitSha = cacheObj.commitSha || '';
                    activeCommitEtag = cacheObj.commitEtag || '';
                } else {
                    localStorage.removeItem(CACHED_RECIPES_KEY);
                }
            }
        } catch (_) {}

        // 1) Instant 0ms local render (never blocks on network; works 100% offline)
        if (initialItems.length > 0) {
            applyRecipeItemsToUI(initialItems, false);
        }

        // 2) Immediately check web on startup and apply changes if any
        syncRecipesFromGitHub(false, 'startup');
    }

    async function fetchRemotePayloadViaGitHubApi() {
        const headers = { 'Accept': 'application/vnd.github.v3+json' };
        const token = getGitHubToken();
        if (token) headers['Authorization'] = `token ${token}`;
        if (activeCommitEtag && activeSyncCommitSha) {
            headers['If-None-Match'] = activeCommitEtag;
        }

        const commitRes = await fetchWithTimeout(
            `https://api.github.com/repos/${GITHUB_REPO}/commits/${GITHUB_BRANCH}`,
            { cache: 'no-store', headers }
        );

        // 304 Not Modified = zero rate-limit cost & guaranteed zero changes on main!
        if (commitRes.status === 304) {
            return { notModified: true, commitSha: activeSyncCommitSha, commitEtag: activeCommitEtag };
        }
        if (!commitRes.ok) {
            throw new Error(`GitHub API HTTP ${commitRes.status}`);
        }

        const newEtag = commitRes.headers.get('etag') || '';
        const commitJson = await commitRes.json();
        const refSha = (commitJson && commitJson.sha) ? commitJson.sha : '';
        if (!refSha) throw new Error('Missing commit SHA');

        if (activeSyncCommitSha && refSha === activeSyncCommitSha) {
            return { notModified: true, commitSha: refSha, commitEtag: newEtag || activeCommitEtag };
        }

        // Check if head commit edited recipe/*.md directly without regenerating docs/recipes-manifest.json
        const changedFiles = Array.isArray(commitJson.files) ? commitJson.files : [];
        const touchedRecipeMd = changedFiles.some(f =>
            f && f.filename && f.filename.endsWith('.md') &&
            (f.filename.startsWith('recipe/') || f.filename.startsWith('recipes/'))
        );
        const touchedManifest = changedFiles.some(f => f && f.filename === 'docs/recipes-manifest.json');

        // Fast path: 1 single immutable-SHA manifest fetch (no CDN lag, no rate limit)
        if (!(touchedRecipeMd && !touchedManifest)) {
            const manifestRes = await fetchWithTimeout(
                `https://raw.githubusercontent.com/${GITHUB_REPO}/${refSha}/docs/recipes-manifest.json`,
                { cache: 'no-store' }
            );
            if (manifestRes.ok) {
                const manifest = await manifestRes.json();
                if (manifest && Array.isArray(manifest.items) && manifest.items.length > 0) {
                    return {
                        notModified: false,
                        commitSha: refSha,
                        commitEtag: newEtag,
                        items: manifest.items,
                        contentHash: manifest.contentHash || computeRecipesHash(manifest.items),
                        imageHashes: manifest.imageHashes || {}
                    };
                }
            }
        }

        // Direct GitHub web-editor path: fetch full tree + raw markdown blobs at exact refSha
        const treeHeaders = { 'Accept': 'application/vnd.github.v3+json' };
        if (token) treeHeaders['Authorization'] = `token ${token}`;
        const treeRes = await fetchWithTimeout(
            `https://api.github.com/repos/${GITHUB_REPO}/git/trees/${refSha}?recursive=1`,
            { cache: 'no-store', headers: treeHeaders }
        );
        if (!treeRes.ok) throw new Error(`Tree HTTP ${treeRes.status}`);
        const treeData = await treeRes.json();

        const recipeFiles = (treeData.tree || []).filter(item =>
            item.type === 'blob' &&
            item.path.endsWith('.md') &&
            (item.path.startsWith('recipe/') || item.path.startsWith('recipes/'))
        );
        if (recipeFiles.length === 0) throw new Error('No recipe markdown files found');

        const knownAddedAt = new Map(allRecipes.map(r => [r.path, r.addedAt || '']));
        const commitDate = (commitJson && commitJson.commit && commitJson.commit.author && commitJson.commit.author.date)
            ? commitJson.commit.author.date
            : new Date().toISOString();

        const fetchedRaw = await Promise.all(recipeFiles.map(async file => {
            const rawUrl = `https://raw.githubusercontent.com/${GITHUB_REPO}/${refSha}/${file.path}`;
            const res = await fetchWithTimeout(rawUrl, { cache: 'no-store' });
            if (!res.ok) return null;
            const content = (await res.text()).replace(/\r\n/g, '\n');
            return {
                path: file.path,
                addedAt: knownAddedAt.get(file.path) || commitDate,
                content
            };
        }));

        const validItems = fetchedRaw.filter(Boolean);
        if (validItems.length === 0) throw new Error('Failed to fetch raw markdown files');
        validItems.sort((a, b) => a.path.localeCompare(b.path));

        return {
            notModified: false,
            commitSha: refSha,
            commitEtag: newEtag,
            items: validItems,
            contentHash: computeRecipesHash(validItems),
            imageHashes: activeImageHashes
        };
    }

    async function fetchRemotePayloadViaPagesManifest() {
        const res = await fetchWithTimeout(
            `${PAGES_BASE_URL}/recipes-manifest.json?t=${Date.now()}`,
            { cache: 'no-store' }
        );
        if (!res.ok) throw new Error(`Pages Manifest HTTP ${res.status}`);
        const manifest = await res.json();
        if (!manifest || !Array.isArray(manifest.items) || manifest.items.length === 0) {
            throw new Error('Invalid manifest payload');
        }
        return {
            notModified: false,
            commitSha: '',
            commitEtag: '',
            items: manifest.items,
            contentHash: manifest.contentHash || computeRecipesHash(manifest.items),
            imageHashes: manifest.imageHashes || {}
        };
    }

    async function syncRecipesFromGitHub(manualTrigger = false, reason = 'manual') {
        if (isSyncingRecipes) return;
        const now = Date.now();
        if (!manualTrigger && (now - lastAutoSyncMs) < AUTO_SYNC_COOLDOWN_MS) {
            return;
        }
        isSyncingRecipes = true;
        if (!manualTrigger) lastAutoSyncMs = now;

        setSyncPillState('syncing', '웹 변경 확인 중...', '🔄');

        try {
            let remotePayload = null;
            try {
                // Channel 1: Instant Commit-SHA sync (0.1s after push, ETag 0-quota check)
                remotePayload = await fetchRemotePayloadViaGitHubApi();
            } catch (_) {
                // Channel 2: Unlimited GitHub Pages CDN manifest fallback (immune to API rate limits)
                remotePayload = await fetchRemotePayloadViaPagesManifest();
            }

            if (remotePayload.notModified) {
                if (remotePayload.commitSha) activeSyncCommitSha = remotePayload.commitSha;
                if (remotePayload.commitEtag) activeCommitEtag = remotePayload.commitEtag;
                setSyncPillState('synced', `최신 상태 (${allRecipes.length}개)`, '✓');
                if (manualTrigger) {
                    showToast(`✅ 웹과 동일한 최신 레시피 상태입니다 (${allRecipes.length}개)`);
                }
                return;
            }

            const remoteHash = remotePayload.contentHash || computeRecipesHash(remotePayload.items);
            const mergedImgHashes = {
                ...(window.BUNDLED_IMAGE_HASHES || {}),
                ...(remotePayload.imageHashes || {})
            };
            const imagesChanged = JSON.stringify(mergedImgHashes) !== JSON.stringify(activeImageHashes);
            const recipesChanged = remoteHash !== activeContentHash;

            if (remotePayload.commitSha) activeSyncCommitSha = remotePayload.commitSha;
            if (remotePayload.commitEtag) activeCommitEtag = remotePayload.commitEtag;
            activeImageHashes = mergedImgHashes;
            activeContentHash = remoteHash;

            // Persist latest synced version to localStorage so even future offline launches show this updated version
            try {
                localStorage.setItem(CACHED_RECIPES_KEY, JSON.stringify({
                    syncedAt: new Date().toISOString(),
                    commitSha: activeSyncCommitSha,
                    commitEtag: activeCommitEtag,
                    contentHash: activeContentHash,
                    imageHashes: activeImageHashes,
                    items: remotePayload.items
                }));
            } catch (_) {}

            if (recipesChanged || imagesChanged) {
                applyRecipeItemsToUI(remotePayload.items, true);
                setSyncPillState('updated', `웹 변경 반영됨 (${allRecipes.length}개)`, '🟢');
                showToast(`🔄 웹에서 변경된 최신 레시피(${allRecipes.length}개)가 반영되었습니다!`);
            } else {
                setSyncPillState('synced', `최신 상태 (${allRecipes.length}개)`, '✓');
                if (manualTrigger) {
                    showToast(`✅ 이미 최신 레시피 상태입니다 (${allRecipes.length}개)`);
                }
            }
        } catch (err) {
            // Sync failed (offline / timeout / server unreachable) -> keep existing local recipes untouched!
            setSyncPillState('offline', `로컬 보관본 (${allRecipes.length}개)`, '📦');
            if (manualTrigger) {
                showToast('📦 오프라인 상태입니다. 기기에 저장된 레시피를 표시합니다.');
            }
            if (allRecipes.length === 0) {
                grid.innerHTML = `<div class="status-message"><p>네트워크 연결을 확인해 주세요.</p></div>`;
            }
        } finally {
            isSyncingRecipes = false;
        }
    }

    // =========================================================================
    // 5. HOME DASHBOARD, SETTINGS, FILTERING & INTERACTIVE MODAL
    // =========================================================================

    function hasMealPrepMode(recipe) {
        return Array.isArray(recipe.modes) && recipe.modes.some(m => /양념육|소스|미리|숙성/.test(m.title));
    }

    function isGochujangIngredient(name) {
        return /고추장/.test(name || '');
    }

    function recipeHasGochujang(recipe) {
        if (!recipe) return false;
        if ((recipe.ingredients || []).some(i => isGochujangIngredient(i.name))) return true;
        if ((recipe.modes || []).some(m => (m.ingredients || []).some(i => isGochujangIngredient(i.name)))) return true;
        if ((recipe.addons || []).some(a => (a.ingredients || []).some(i => isGochujangIngredient(i.name)))) return true;
        return false;
    }

    function navigateToTab(tabName, options = {}) {
        const target = (tabName === 'recipes' || tabName === 'settings') ? tabName : 'home';
        const pushHistory = options.pushHistory !== false;
        const prevTab = currentTab;
        currentTab = target;

        document.querySelectorAll('.app-view').forEach(sec => {
            sec.classList.toggle('active', sec.id === `view-${target}`);
        });
        document.querySelectorAll('.bottom-tab-btn[data-tab]').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('data-tab') === target);
        });

        if (target === 'home') {
            renderHomeDashboard();
        } else if (target === 'settings') {
            renderSettingsView();
        } else if (target === 'recipes') {
            setupFilterTabs();
            applyFilter();
        }

        if (pushHistory && prevTab === 'home' && target !== 'home') {
            try {
                history.pushState({ tab: target }, '');
            } catch (_) {}
        }

        try { window.scrollTo(0, 0); } catch (_) {}
    }

    function setSortMode(mode) {
        if (mode !== 'recent_viewed' && mode !== 'newly_added' && mode !== 'most_viewed') return;
        currentSortMode = mode;
        try {
            localStorage.setItem(SORT_MODE_KEY, mode);
        } catch (_) {}
        setupFilterTabs();
        applyFilter();
        renderHomeDashboard();
    }

    function openRecipesMenu({ category = 'all', mealPrepOnly = false, sortMode = null } = {}) {
        currentCategory = category;
        mealPrepOnlyFilter = !!mealPrepOnly;
        if (sortMode && (sortMode === 'recent_viewed' || sortMode === 'newly_added' || sortMode === 'most_viewed')) {
            currentSortMode = sortMode;
            try { localStorage.setItem(SORT_MODE_KEY, sortMode); } catch (_) {}
        }
        if (searchInput) searchInput.value = '';
        const titleEl = document.getElementById('recipes-view-title');
        if (titleEl) {
            if (mealPrepOnlyFilter) {
                titleEl.textContent = '🫙 밀프렙 · 양념 미리 만들기';
            } else if (category !== 'all') {
                titleEl.textContent = `📖 ${category} 레시피`;
            } else {
                titleEl.textContent = '📖 전체 레시피';
            }
        }
        navigateToTab('recipes');
    }

    function renderHomeDashboard() {
        const totalSub = document.getElementById('home-total-recipes-sub');
        if (totalSub) {
            totalSub.textContent = `총 ${allRecipes.length}종 등록 · 원하는 정렬로 둘러보기`;
        }
        updateGochujangPillsUI();

        // Update Home Sort Tabs active state
        document.querySelectorAll('#home-sort-tabs .home-sort-tab[data-sort]').forEach(btn => {
            btn.classList.toggle('active', btn.getAttribute('data-sort') === currentSortMode);
        });

        // Category Quick Chips
        const catGrid = document.getElementById('home-category-grid');
        if (catGrid) {
            const catIcons = { '한식': '🥘', '양식': '🍝', '일식': '🍚', '중식': '🥟', '디저트/베이킹': '🍰', '분식/간식': '🍢' };
            const categories = Array.from(new Set(allRecipes.map(r => r.category))).filter(Boolean);

            const html = categories.map(cat => {
                const cnt = allRecipes.filter(r => r.category === cat).length;
                const ic = catIcons[cat] || '🍽️';
                const safeCat = cat.replace(/'/g, "\\'");
                return `
                    <button class="home-cat-chip" onclick="openRecipesMenu({ category: '${safeCat}', mealPrepOnly: false })">
                        <span>${ic} ${cat}</span>
                        <span class="home-cat-count">${cnt}</span>
                    </button>
                `;
            }).join('');
            catGrid.innerHTML = html;
        }

        // Home Sorted Showcase List (최근에 본 · 최근 추가된 · 많이 본)
        const recentListEl = document.getElementById('home-recent-list');
        const recentHeading = document.getElementById('home-recent-heading');
        const hintEl = document.getElementById('home-sort-hint');
        if (recentListEl) {
            const recentMap = getRecentViewsMap();
            const countsMap = getViewCountsMap();
            const hasAnyRecent = allRecipes.some(r => !!recentMap[r.id]);
            const hasAnyCount = allRecipes.some(r => getEffectiveViewCount(r.id, recentMap, countsMap) > 0);

            let displayItems = [];
            let hintText = '';

            if (currentSortMode === 'newly_added') {
                if (recentHeading) recentHeading.textContent = '🆕 최근 추가된 요리';
                displayItems = sortRecipeList(allRecipes, 'newly_added', recentMap, countsMap).slice(0, 4);
            } else if (currentSortMode === 'most_viewed') {
                if (recentHeading) recentHeading.textContent = '🔥 많이 본 요리';
                if (hasAnyCount) {
                    displayItems = sortRecipeList(
                        allRecipes.filter(r => getEffectiveViewCount(r.id, recentMap, countsMap) > 0),
                        'most_viewed',
                        recentMap,
                        countsMap
                    ).slice(0, 4);
                } else {
                    hintText = '💡 아직 30초 이상 살펴본 조회 기록이 없어 최근 추가된 순으로 보여드려요.';
                    displayItems = sortRecipeList(allRecipes, 'newly_added', recentMap, countsMap).slice(0, 4);
                }
            } else {
                // 'recent_viewed'
                if (recentHeading) recentHeading.textContent = '🕘 최근에 본 요리';
                if (hasAnyRecent) {
                    displayItems = sortRecipeList(
                        allRecipes.filter(r => !!recentMap[r.id]),
                        'recent_viewed',
                        recentMap,
                        countsMap
                    ).slice(0, 4);
                } else {
                    hintText = '💡 30초 이상 화면을 본 레시피가 이곳에 자동 기록됩니다. 지금은 새로 추가된 요리를 먼저 보여드려요.';
                    displayItems = sortRecipeList(allRecipes, 'newly_added', recentMap, countsMap).slice(0, 4);
                }
            }

            if (hintEl) {
                if (hintText && allRecipes.length > 0) {
                    hintEl.textContent = hintText;
                    hintEl.style.display = 'block';
                } else {
                    hintEl.textContent = '';
                    hintEl.style.display = 'none';
                }
            }

            if (displayItems.length === 0) {
                recentListEl.innerHTML = `<div style="color:#64748B; font-size:0.86rem; padding:0.8rem 0;">레시피를 불러오는 중입니다...</div>`;
            } else {
                recentListEl.innerHTML = displayItems.map(r => {
                    const thumbHtml = r.heroImage
                        ? `<img src="${r.heroImage}" alt="${r.title.replace(/"/g, '&quot;')}" loading="lazy" onerror="handleRecipeImgError(this, '${r.icon}')">`
                        : `${r.icon}`;

                    let badgeHtml = '';
                    const viewCnt = getEffectiveViewCount(r.id, recentMap, countsMap);
                    if (currentSortMode === 'newly_added' || (!hasAnyRecent && currentSortMode === 'recent_viewed') || (!hasAnyCount && currentSortMode === 'most_viewed')) {
                        const addLabel = formatAddedDateLabel(r.addedAtMs);
                        if (addLabel) badgeHtml = `<span class="home-recent-badge badge-new">🆕 ${addLabel}</span>`;
                    } else if (currentSortMode === 'most_viewed' && viewCnt > 0) {
                        badgeHtml = `<span class="home-recent-badge badge-hot">🔥 ${viewCnt}회 조회</span>`;
                    } else if (recentMap[r.id]) {
                        badgeHtml = `<span class="home-recent-badge badge-recent">🕘 ${formatRelativeTimeLabel(recentMap[r.id])}</span>`;
                    }

                    return `
                        <div class="home-recent-item" onclick="openRecipe('${r.id.replace(/'/g, "\\'")}')">
                            <div class="home-recent-thumb">${thumbHtml}</div>
                            <div class="home-recent-info">
                                <h4>${r.title}</h4>
                                <div class="home-recent-meta">
                                    <span>🍽️ ${r.category}</span>
                                    <span>👥 기본 ${r.baseServings}인분</span>
                                    <span>🕒 ${r.time}</span>
                                    ${badgeHtml}
                                </div>
                            </div>
                            <span class="home-recent-arrow">›</span>
                        </div>
                    `;
                }).join('');
            }
        }
    }

    function setGochujangRatio(newRatio, fromSlider = false) {
        const parsed = parseFloat(newRatio);
        if (isNaN(parsed)) return;
        const clamped = Math.max(0.3, Math.min(1.3, Math.round(parsed * 20) / 20));
        appSettings.gochujangRatio = clamped;
        saveAppSettings();

        // Update Settings screen readout/buttons if currently rendered
        const readout = document.getElementById('settings-gochujang-readout');
        if (readout) readout.textContent = `${Math.round(clamped * 100)}%`;
        const slider = document.getElementById('settings-gochujang-slider');
        if (slider && !fromSlider) slider.value = Math.round(clamped * 100);
        const preview = document.getElementById('settings-gochujang-preview');
        if (preview) {
            preview.innerHTML = buildGochujangPreviewText(clamped);
        }
        document.querySelectorAll('[data-gochujang-preset]').forEach(btn => {
            const pVal = parseFloat(btn.getAttribute('data-gochujang-preset'));
            btn.classList.toggle('active', Math.abs(pVal - clamped) < 0.01);
        });

        // If a recipe modal is currently open, refresh all N-serving sections live!
        if (activeRecipeId && modal.classList.contains('active')) {
            const recipe = allRecipes.find(r => r.id === activeRecipeId);
            if (recipe) {
                updateServingPortion(currentServings);
            }
        }

        if (!fromSlider) {
            showToast(`🌶️ 고추장 비율이 ${Math.round(clamped * 100)}%로 적용되었습니다!`);
        }
    }

    function buildGochujangPreviewText(ratio) {
        const pct = Math.round(ratio * 100);
        const exTteok = scaleAmountText('1.5큰술 (약 30g)', ratio);
        const exJeyuk = scaleAmountText('0.8큰술 (약 16g)', ratio);
        return `📌 <strong>적용 예시 (${pct}%):</strong> 떡볶이(2인분) 고추장 1.5큰술(30g) → <strong>${exTteok}</strong> · 제육볶음(2인분) 0.8큰술(16g) → <strong>${exJeyuk}</strong>`;
    }

    function toggleAppSetting(key, checked) {
        if (!(key in DEFAULT_APP_SETTINGS)) return;
        appSettings[key] = !!checked;
        if (key === 'defaultSmartScale') {
            smartScaleEnabled = !!checked;
        }
        saveAppSettings();
        if (key === 'timerSoundEnabled' || key === 'timerVibrateEnabled') {
            syncNativeTimerSchedule();
        }
        showToast('⚙️ 설정이 저장되었습니다.');
    }

    function clearRecentViewHistory() {
        localStorage.removeItem(RECENT_VIEWS_KEY);
        localStorage.removeItem(VIEW_COUNTS_KEY);
        applyFilter();
        renderHomeDashboard();
        showToast('🕘 최근 조회 및 많이 본 기록이 초기화되었습니다.');
    }

    function resetAllAppSettings() {
        appSettings = { ...DEFAULT_APP_SETTINGS };
        smartScaleEnabled = appSettings.defaultSmartScale;
        saveAppSettings();
        renderSettingsView();
        showToast('⚙️ 모든 앱 설정이 기본값으로 복원되었습니다.');

        container.innerHTML = `

                <p class="settings-card-desc">

        categories.forEach(cat => {
            const count = allRecipes.filter(r => r.category === cat).length;
            catHtml += `<button class="category-tab ${(!mealPrepOnlyFilter && currentCategory === cat) ? 'active' : ''}" onclick="filterByCategory('${cat}')">${cat} (${count})</button>`;
        });
        const mealPrepCount = allRecipes.filter(hasMealPrepMode).length;
        if (mealPrepCount > 0) {
            catHtml += `<button class="category-tab ${mealPrepOnlyFilter ? 'active' : ''}" onclick="toggleMealPrepFilter()">🫙 밀프렙·소스 (${mealPrepCount})</button>`;

            sortTabsContainer.innerHTML = `

                <button class="sort-tab ${currentSortMode === 'most_viewed' ? 'active' : ''}" data-sort="most_viewed" onclick="setSortMode('most_viewed')">🔥 많이 본</button>

        if (titleEl) {
            titleEl.textContent = mealPrepOnlyFilter ? '🫙 밀프렙 · 양념 미리 만들기' : '📖 전체 레시피';

        setupFilterTabs();

    function filterByCategory(cat) {
        mealPrepOnlyFilter = false;
        currentCategory = cat;
        const titleEl = document.getElementById('recipes-view-title');
        if (titleEl) {
            titleEl.textContent = cat === 'all' ? '📖 전체 레시피' : `📖 ${cat} 레시피`;

    function applyFilter() {
        const query = searchInput.value.toLowerCase().trim();
        const recentViews = getRecentViewsMap();
        const viewCounts = getViewCountsMap();

        const filtered = allRecipes.filter(r => {
            const matchMealPrep = !mealPrepOnlyFilter || hasMealPrepMode(r);
            const matchCategory = currentCategory === 'all' || r.category === currentCategory;
            const matchSearch = !query ||
                r.title.toLowerCase().includes(query) ||
                r.description.toLowerCase().includes(query) ||
                (r.comment && r.comment.toLowerCase().includes(query)) ||
                r.ingredients.some(i => i.name.toLowerCase().includes(query)) ||
                r.rawMarkdown.toLowerCase().includes(query);
            return matchMealPrep && matchCategory && matchSearch;
        });

        const sorted = sortRecipeList(filtered, currentSortMode, recentViews, viewCounts);
        renderRecipes(sorted, recentViews, viewCounts);
    }

    searchInput.addEventListener('input', applyFilter);

    function renderRecipes(items, recentViews = getRecentViewsMap(), viewCounts = getViewCountsMap()) {
        if (items.length === 0) {
            grid.innerHTML = `
                <div class="status-message" style="grid-column: 1 / -1;">
                    <p>🔍 조건에 맞는 레시피가 없습니다.</p>
                </div>`;
            return;
        }

        const nowMs = Date.now();
        grid.innerHTML = items.map(recipe => {
            const commentHtml = recipe.comment
                ? `<div class="card-comment-snippet">💬 ${recipe.comment}</div>`
                : '';

            const variationCount = (recipe.modes ? recipe.modes.length : 0) + (recipe.addons ? recipe.addons.length : 0);
            const isRecent = !!recentViews[recipe.id];
            const viewCount = getEffectiveViewCount(recipe.id, recentViews, viewCounts);
            const isRecentlyAdded = recipe.addedAtMs && (nowMs - recipe.addedAtMs) <= 7 * 86400000;

            const pills = [];
            if (currentSortMode === 'newly_added' || isRecentlyAdded) {
                const addedLabel = formatAddedDateLabel(recipe.addedAtMs);
                if (addedLabel) pills.push(`<span class="card-mini-pill pill-new">🆕 ${addedLabel}</span>`);
            }
            if (currentSortMode === 'most_viewed' && viewCount > 0) {
                pills.push(`<span class="card-mini-pill pill-views">🔥 ${viewCount}회 조회</span>`);
            } else if (isRecent) {
                pills.push(`<span class="card-mini-pill pill-recent">🕘 ${formatRelativeTimeLabel(recentViews[recipe.id])}${viewCount >= 2 ? ` · ${viewCount}회` : ''}</span>`);
            }
            if (variationCount > 0) {
                pills.push(`<span class="card-mini-pill pill-variation">🎛️ 베리에이션 ${variationCount}종</span>`);
            }

            const miniPillsHtml = pills.length > 0 ? `<div class="card-meta-pills">${pills.join('')}</div>` : '';
            const totalTimers = recipe.steps.reduce((acc, s) => acc + s.timers.length, 0);

            const cardMediaHtml = recipe.heroImage
                ? `<img class="card-hero-img" src="${recipe.heroImage}" alt="${recipe.title.replace(/"/g, '&quot;')}" loading="lazy" onerror="handleRecipeImgError(this, '${recipe.icon}')">`
                : `${recipe.icon}`;

            return `
                <div class="recipe-card" onclick="openRecipe('${recipe.id.replace(/'/g, "\\'")}')">
                    <div class="card-image">
                        ${cardMediaHtml}
                        <span class="card-badge">${recipe.category}</span>
                    </div>
                    <div class="card-content">
                        <div>
                            ${miniPillsHtml}
                            <h3>${recipe.title}</h3>
                            <p>${recipe.description}</p>
                            ${commentHtml}
                        </div>
                        <div class="card-info">
                            <span>👥 기본 ${recipe.baseServings}인분</span>
                            <span>🕒 ${recipe.time}</span>
                            ${totalTimers > 0 ? `<span>⏱️ 타이머 ${totalTimers}개</span>` : `<span>📊 ${recipe.difficulty}</span>`}
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    // =========================================================================
    // CENTRALIZED SINGLE-SOURCE-OF-TRUTH N-SERVINGS VARIABLE ENGINE
    // =========================================================================

    function computeScaledEntry(entry, rawRatio, smartEnabled, gRatio = appSettings.gochujangRatio) {
        const { factor, reason } = getSmartScaleFactor(entry.role || 'main', rawRatio, smartEnabled);
        const isGochujang = isGochujangIngredient(entry.name || '');
        const finalFactor = isGochujang ? (factor * gRatio) : factor;
        const scaledAmt = scaleAmountText(entry.amount || '', finalFactor);
        const mainAmt = (scaledAmt.split(/\s*\(/)[0] || '').trim() || scaledAmt;
        const isNonLinearAdjusted = Boolean(
            reason &&
            Math.abs(factor - rawRatio) / Math.max(0.1, rawRatio) >= 0.05 &&
            /\d/.test(entry.amount || '')
        );
        const isScaled = Math.abs(finalFactor - 1) >= 0.01 && /\d/.test(entry.amount || '');
        return {
            scaledAmt,
            mainAmt,
            factor,
            finalFactor,
            reason,
            isGochujang,
            isNonLinearAdjusted,
            isScaled
        };
    }

    function buildVariableContext(recipe, targetServings = currentServings, smartEnabled = smartScaleEnabled) {
        const baseServ = (recipe && recipe.baseServings) ? recipe.baseServings : 1;
        const rawRatio = targetServings / baseServ;
        const gRatio = appSettings.gochujangRatio;
        const varMap = new Map();

        const registerList = (list) => {
            if (!Array.isArray(list)) return;
            for (const item of list) {
                if (!item || !item.varKey) continue;
                varMap.set(item.varKey, computeScaledEntry(item, rawRatio, smartEnabled, gRatio));
            }
        };

        // 1) Base ingredients + auxiliary cooking variables
        registerList(recipe.ingredients);
        registerList(recipe.auxVariables);

        // 2) All modes & addons (so full collapsible markdown also resolves every section's variables)
        for (const m of (recipe.modes || [])) {
            registerList(m.ingredients);
            registerList(m.auxVariables);
        }
        for (const a of (recipe.addons || [])) {
            registerList(a.ingredients);
            registerList(a.auxVariables);
        }

        // 3) Active mode / active addons take top priority if any key overlaps
        if (activeVariationMode !== 'base') {
            const activeMode = (recipe.modes || []).find(m => m.id === activeVariationMode);
            if (activeMode) {
                registerList(activeMode.ingredients);
                registerList(activeMode.auxVariables);
            }
        } else {
            for (const a of (recipe.addons || [])) {
                if (activeAddonIds.has(a.id)) {
                    registerList(a.ingredients);
                    registerList(a.auxVariables);
                }
            }
        }

        // 4) Built-in serving tokens
        const isServingChanged = Math.abs(rawRatio - 1) >= 0.01;
        const servText = `${targetServings}인분`;
        varMap.set('servings', { scaledAmt: servText, mainAmt: servText, isScaled: isServingChanged });
        varMap.set('인분', { scaledAmt: servText, mainAmt: servText, isScaled: isServingChanged });
        varMap.set('servings_num', { scaledAmt: String(targetServings), mainAmt: String(targetServings), isScaled: isServingChanged });

        return { varMap, rawRatio };
    }

    function resolveTokensPlain(rawText, varMap) {
        if (!rawText) return '';
        return rawText.replace(
            /`\{\{\s*([a-zA-Z0-9_가-힣]+)(?::(main|full))?\s*\}\}`|\{\{\s*([a-zA-Z0-9_가-힣]+)(?::(main|full))?\s*\}\}/g,
            (full, k1, m1, k2, m2) => {
                const key = k1 || k2;
                const modifier = m1 || m2 || 'full';
                const resolved = varMap ? varMap.get(key) : null;
                if (!resolved) return full;
                return modifier === 'main' ? resolved.mainAmt : resolved.scaledAmt;
            }
        );
    }

    function formatInlineMdWithVars(rawText, varMap) {
        if (!rawText) return '';
        const formatted = formatInlineMd(rawText);
        return formatted.replace(
            /(?:<code>)?\{\{\s*([a-zA-Z0-9_가-힣]+)(?::(main|full))?\s*\}\}(?:<\/code>)?/g,
            (full, key, modifier) => {
                const resolved = varMap ? varMap.get(key) : null;
                if (!resolved) return full;
                const val = modifier === 'main' ? resolved.mainAmt : resolved.scaledAmt;
                return `<span class="step-var-val${resolved.isScaled ? ' is-scaled' : ''}">${val}</span>`;
            }
        );
    }

    function getEffectiveRecipeView(recipe, varMap = null) {
        if (activeVariationMode !== 'base') {
            const mode = (recipe.modes || []).find(m => m.id === activeVariationMode);
            if (mode) {
                const descHtml = mode.rawDescription
                    ? formatInlineMdWithVars(mode.rawDescription, varMap)
                    : (mode.descriptionHtml || '');
                return {
                    ingredients: mode.ingredients.length > 0 ? mode.ingredients : recipe.ingredients,
                    containers: (mode.containers && mode.containers.length > 0) ? mode.containers : (recipe.containers || []),
                    steps: mode.steps.length > 0 ? mode.steps : recipe.steps,
                    notesHtml: descHtml ? `<strong>${mode.title}:</strong> ${descHtml}` : ''
                };
            }
        }

        const mergedIngredients = [...recipe.ingredients];
        const mergedContainers = [...(recipe.containers || [])];
        const baseClones = recipe.steps.map(s => ({
            ...s,
            baseIndex: s.index,
            timers: [...(s.timers || [])],
            addonAdditions: []
        }));
        const afterStepMap = new Map();
        const endAddonSteps = [];
        const selectedNotes = [];

        for (const addon of (recipe.addons || [])) {
            if (!activeAddonIds.has(addon.id)) continue;
            const addonDescHtml = addon.rawDescription
                ? formatInlineMdWithVars(addon.rawDescription, varMap)
                : (addon.descriptionHtml || '');
            if (addonDescHtml) {
                selectedNotes.push(`<strong>➕ ${addon.title}:</strong> ${addonDescHtml}`);
            }
            for (const ing of addon.ingredients) {
                mergedIngredients.push({
                    ...ing,
                    isAddon: true,
                    addonId: addon.id,
                    addonTitle: addon.title
                });
            }
            for (const ct of (addon.containers || [])) {
                mergedContainers.push({
                    ...ct,
                    isAddon: true,
                    addonId: addon.id,
                    addonTitle: addon.title
                });
            }
            (addon.steps || []).forEach((st, stIdx) => {
                if (st.attachToStep > 0 && baseClones.length > 0) {
                    const targetStep = baseClones.find(b => b.baseIndex === st.attachToStep) || baseClones[baseClones.length - 1];
                    targetStep.addonAdditions.push({
                        addonId: addon.id,
                        addonTitle: addon.title,
                        rawTitle: st.rawTitle,
                        rawLines: st.rawLines,
                        titleHtml: st.titleHtml,
                        bodyHtml: st.bodyHtml
                    });
                    for (const tm of (st.timers || [])) {
                        if (!targetStep.timers.some(existing => existing.seconds === tm.seconds)) {
                            targetStep.timers.push({ ...tm });
                        }
                    }
                } else if (st.insertAfterStep > 0) {
                    if (!afterStepMap.has(st.insertAfterStep)) {
                        afterStepMap.set(st.insertAfterStep, []);
                    }
                    afterStepMap.get(st.insertAfterStep).push({
                        ...st,
                        isAddon: true,
                        addonId: addon.id,
                        addonTitle: addon.title,
                        addonStepIdx: stIdx,
                        addonAdditions: []
                    });
                } else {
                    endAddonSteps.push({
                        ...st,
                        isAddon: true,
                        addonId: addon.id,
                        addonTitle: addon.title,
                        addonStepIdx: stIdx,
                        addonAdditions: []
                    });
                }
            });
        }

        const mergedSteps = [];
        for (const b of baseClones) {
            mergedSteps.push(b);
            if (afterStepMap.has(b.baseIndex)) {
                mergedSteps.push(...afterStepMap.get(b.baseIndex));
                afterStepMap.delete(b.baseIndex);
            }
        }
        for (const leftoverList of afterStepMap.values()) {
            mergedSteps.push(...leftoverList);
        }
        mergedSteps.push(...endAddonSteps);
        mergedSteps.forEach((st, idx) => {
            st.index = idx + 1;
        });

        return {
            ingredients: mergedIngredients,
            containers: mergedContainers,
            steps: mergedSteps,
            notesHtml: selectedNotes.join('<br style="margin-bottom:0.35rem;">')
        };
    }

    function splitParentheticalLabel(str) {
        const s = (str || '').trim();
        const m = s.match(/^([^(]+?)\s*\(([^)]+)\)\s*$/);
        if (!m) return { primary: s, sub: '' };
        return { primary: m[1].trim(), sub: m[2].trim() };
    }

    function shortenDuplicateRoleHint(sub) {
        if (!sub) return '';
        return sub
            .replace(/^미림\s*·\s*/g, '')
            .replace(/\s*(?:배합용|추출용|에\s*투입|에\s*먼저\s*투입|사용\s*시)/g, (m) => m.includes('용') ? '용' : '')
            .replace(/양념장에\s*갈거나\s*다져\s*넣음/g, '양념장용')
            .replace(/나중에\s*볶을\s*때\s*투입/g, '볶음용')
            .replace(/팬\s*가장자리\s*불향용/g, '불향용')
            .replace(/팬\s*가장자리에/g, '불향용')
            .replace(/고기용\s*추가/g, '고기추가')
            .trim();
    }
