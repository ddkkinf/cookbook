<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#E63946">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>김용훈의 레시피</title>
    <!-- Fonts (online progressive enhancement, graceful system fallback offline) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Offline-bundled Marked.js & Bundled Recipes -->
    <script src="./vendor/marked.min.js"></script>
    <script src="./bundled-recipes.js?v=mvwa18ja"></script>
    <style>
        :root {
            --primary: #E63946;
            --primary-dark: #C1121F;
            --bg: #F8F9FA;
            --card-bg: #FFFFFF;
            --text-main: #1D3557;
            --text-muted: #457B9D;
            --accent: #A8DADC;
            --teal: #2A9D8F;
            --amber: #E76F51;
            --border-radius: 16px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.06);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            padding-top: var(--safe-top);
            padding-bottom: calc(5rem + var(--safe-bottom));
        }

        /* Layout */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem 1.25rem;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 1.8rem;
            animation: fadeInDown 0.6s ease-out;
        }

        header h1 {
            font-size: 2.7rem;
            font-weight: 800;
            margin-bottom: 0.4rem;
            letter-spacing: -1px;
            background: linear-gradient(135deg, var(--text-main), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.02rem;
        }

        .header-bar-actions {
            margin-top: 0.9rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .apk-download-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.5rem 1.1rem;
            border-radius: 50px;
            background: linear-gradient(135deg, #1D3557, #2A9D8F);
            color: white;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(42, 157, 143, 0.25);
            transition: var(--transition);
        }

        .apk-download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(42, 157, 143, 0.35);
        }

        .sync-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.4rem 0.85rem;
            border-radius: 50px;
            background: white;
            border: 1px solid #E5E7EB;
            color: #4B5563;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .sync-pill.syncing {
            border-color: #BFDBFE;
            background: #EFF6FF;
            color: #1D4ED8;
        }

        .sync-pill.updated {
            border-color: #6EE7B7;
            background: #ECFDF5;
            color: #047857;
        }

        .sync-pill.offline {
            border-color: #FDE68A;
            background: #FFFBEB;
            color: #92400E;
        }

        @keyframes spinSyncIcon {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .sync-pill.syncing #sync-status-icon {
            display: inline-block;
            animation: spinSyncIcon 1s linear infinite;
        }

        /* Category & Status Filter Tabs */
        .filter-controls {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            align-items: center;
            margin-bottom: 1.6rem;
        }

        .category-tabs, .status-tabs {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .category-tab, .status-tab {
            padding: 0.48rem 1.05rem;
            border-radius: 50px;
            background: white;
            color: var(--text-main);
            font-size: 0.88rem;
            font-weight: 600;
            border: 1px solid rgba(0,0,0,0.06);
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            transition: var(--transition);
        }

        .category-tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(230, 57, 70, 0.3);
        }

        .status-tab.active {
            background: var(--text-main);
            color: white;
            border-color: var(--text-main);
        }

        .status-tab.active[data-status="verified"] {
            background: var(--teal);
            border-color: var(--teal);
        }

        .status-tab.active[data-status="needs_fix"] {
            background: var(--amber);
            border-color: var(--amber);
        }

        /* Status Badges on Cards */
        .card-status-badge {
            position: absolute;
            top: 0.9rem;
            left: 0.9rem;
            padding: 0.28rem 0.7rem;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }

        .status-verified { background: rgba(42, 157, 143, 0.95); color: white; }
        .status-needs_fix { background: rgba(231, 111, 81, 0.95); color: white; }
        .status-unverified { background: rgba(108, 117, 125, 0.85); color: white; }

        /* Recipe Comment Note */
        .recipe-comment-box {
            background: #FFF8E7;
            border-left: 4px solid #E9C46A;
            padding: 1rem 1.2rem;
            border-radius: 10px;
            margin-bottom: 1.5rem;
            color: #7A5800;
            font-size: 0.94rem;
            line-height: 1.55;
            display: flex;
            align-items: flex-start;
            gap: 0.7rem;
        }

        .card-comment-snippet {
            font-size: 0.82rem;
            color: #7A5800;
            background: #FFF9E6;
            padding: 0.38rem 0.65rem;
            border-radius: 6px;
            margin-top: 0.5rem;
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
            border-left: 3px solid #E9C46A;
        }

        /* Search Bar */
        .search-container {
            position: sticky;
            top: calc(0.6rem + var(--safe-top));
            z-index: 90;
            margin-bottom: 2rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .search-wrapper {
            position: relative;
            box-shadow: var(--shadow);
            border-radius: 50px;
            overflow: hidden;
            background: white;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .search-icon {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.05rem;
            pointer-events: none;
        }

        #search-input {
            width: 100%;
            padding: 1rem 1.3rem 1rem 3.1rem;
            border: none;
            outline: none;
            font-size: 1rem;
            font-family: inherit;
            background: transparent;
        }

        /* Recipe Grid */
        #recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 1.5rem;
            animation: fadeIn 0.5s ease-in;
        }

        .recipe-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .recipe-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 18px 25px -5px rgba(0, 0, 0, 0.14);
        }

        .recipe-card:active {
            transform: scale(0.985);
        }

        .card-image {
            height: 175px;
            background: linear-gradient(135deg, #FFF8EB, #F3E5D0);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3.6rem;
            position: relative;
            overflow: hidden;
        }

        .card-hero-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .recipe-card:hover .card-hero-img {
            transform: scale(1.045);
        }

        .card-badge {
            position: absolute;
            top: 0.9rem;
            right: 0.9rem;
            background: rgba(255, 255, 255, 0.95);
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--primary);
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .card-content {
            padding: 1.35rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-content h3 {
            font-size: 1.25rem;
            margin-bottom: 0.45rem;
            color: var(--text-main);
        }

        .card-content p {
            font-size: 0.92rem;
            color: #6c757d;
            margin-bottom: 0.9rem;
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-info {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            font-size: 0.82rem;
            color: var(--text-muted);
            border-top: 1px solid #f0f0f0;
            padding-top: 0.75rem;
        }

        .card-meta-pills {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            margin-bottom: 0.65rem;
        }

        .card-mini-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.2rem 0.58rem;
            border-radius: 50px;
            font-size: 0.74rem;
            font-weight: 700;
        }

        .pill-recent {
            background: #EFF6FF;
            color: #1D4ED8;
            border: 1px solid #BFDBFE;
        }

        .pill-variation {
            background: #F5F3FF;
            color: #6D28D9;
            border: 1px solid #DDD6FE;
        }

        /* Modal */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(29, 53, 87, 0.62);
            backdrop-filter: blur(6px);
            z-index: 1000;
            display: none;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .modal.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--bg);
            width: 100%;
            max-width: 840px;
            height: 92vh;
            margin: auto;
            border-radius: 24px;
            overflow-y: auto;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.28);
            padding-bottom: calc(5rem + var(--safe-bottom));
        }

        .modal-sticky-topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: calc(0.8rem + var(--safe-top)) 1.2rem 0.8rem;
            background: rgba(248, 249, 250, 0.92);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .wakelock-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.42rem 0.85rem;
            border-radius: 50px;
            border: 1px solid #D1D5DB;
            background: white;
            color: #4B5563;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .wakelock-btn.active {
            background: #FEF3C7;
            border-color: #F59E0B;
            color: #B45309;
        }

        .close-btn {
            background: white;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            border: none;
            font-size: 1.15rem;
            color: var(--text-main);
            transition: var(--transition);
        }

        .close-btn:hover {
            background: var(--primary);
            color: white;
        }

        .modal-body {
            padding: 1.4rem 1.8rem 2.5rem;
        }

        .recipe-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .recipe-header h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .recipe-meta {
            display: flex;
            justify-content: center;
            gap: 1.1rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            padding: 0.9rem 1rem;
            background: white;
            border-radius: var(--border-radius);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
            font-size: 0.92rem;
        }

        /* ==========================================
           INTERACTIVE VARIATION SELECTOR PANEL
           ========================================== */
        .variation-selector-card {
            background: linear-gradient(135deg, #FFFFFF 0%, #F5F3FF 100%);
            border: 2px solid #DDD6FE;
            border-radius: var(--border-radius);
            padding: 1.2rem 1.35rem;
            margin-bottom: 1.3rem;
            box-shadow: 0 4px 14px rgba(109, 40, 217, 0.07);
        }

        .variation-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.4rem;
            margin-bottom: 0.85rem;
        }

        .variation-header h4 {
            font-size: 1.05rem;
            color: #4C1D95;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.45rem;
        }

        .variation-subhint {
            font-size: 0.78rem;
            color: #6D28D9;
            font-weight: 600;
        }

        .variation-mode-tabs {
            display: flex;
            gap: 0.48rem;
            flex-wrap: wrap;
            margin-bottom: 0.65rem;
        }

        .variation-mode-btn {
            padding: 0.5rem 0.95rem;
            border-radius: 12px;
            border: 1.5px solid #DDD6FE;
            background: white;
            color: #4B5563;
            font-size: 0.86rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .variation-mode-btn:hover {
            border-color: #A78BFA;
        }

        .variation-mode-btn.active {
            background: #6D28D9;
            border-color: #6D28D9;
            color: white;
            box-shadow: 0 4px 10px rgba(109, 40, 217, 0.25);
        }

        .variation-addons-wrap {
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px dashed #DDD6FE;
        }

        .variation-addons-label {
            font-size: 0.8rem;
            font-weight: 700;
            color: #5B21B6;
            margin-bottom: 0.5rem;
            display: block;
        }

        .variation-addons-chips {
            display: flex;
            gap: 0.48rem;
            flex-wrap: wrap;
        }

        .variation-addon-chip {
            padding: 0.44rem 0.9rem;
            border-radius: 50px;
            border: 1.5px solid #CBD5E1;
            background: white;
            color: #334155;
            font-size: 0.84rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        .variation-addon-chip.active {
            background: #ECFDF5;
            border-color: #10B981;
            color: #047857;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.18);
        }

        .variation-desc-box {
            margin-top: 0.8rem;
            background: rgba(255, 255, 255, 0.88);
            border-left: 4px solid #7C3AED;
            padding: 0.65rem 0.9rem;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #3B0764;
            line-height: 1.5;
            display: none;
        }

        .variation-desc-box.visible {
            display: block;
        }

        .ingredients-list li.addon-ing-item {
            border-color: #6EE7B7;
            background: #F0FDF4;
        }

        .addon-ing-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.2rem;
            background: #D1FAE5;
            color: #065F46;
            padding: 0.1rem 0.48rem;
            border-radius: 50px;
            font-size: 0.71rem;
            font-weight: 700;
        }

        .step-item.addon-step-item {
            border-color: #6EE7B7;
            background: #F8FFFA;
        }

        /* ==========================================
           SMART SERVING & PORTION CALCULATOR PANEL
           ========================================== */
        .serving-calculator-card {
            background: linear-gradient(135deg, #FFFFFF 0%, #FFF5F5 100%);
            border: 2px solid #FECACA;
            border-radius: var(--border-radius);
            padding: 1.25rem 1.4rem;
            margin-bottom: 1.8rem;
            box-shadow: 0 4px 14px rgba(230, 57, 70, 0.08);
        }

        .serving-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.9rem;
        }

        .serving-title-group {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }

        .serving-title-group h4 {
            font-size: 1.08rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.45rem;
            margin: 0;
        }

        .serving-base-hint {
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .serving-stepper {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            background: white;
            padding: 0.35rem 0.55rem;
            border-radius: 50px;
            border: 1.5px solid #FCA5A5;
            box-shadow: 0 2px 6px rgba(230, 57, 70, 0.1);
        }

        .stepper-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: var(--primary);
            color: white;
            font-size: 1.15rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .stepper-btn:active {
            transform: scale(0.9);
        }

        .stepper-btn:disabled {
            background: #E5E7EB;
            color: #9CA3AF;
            cursor: not-allowed;
        }

        .serving-input {
            width: 54px;
            text-align: center;
            border: none;
            outline: none;
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--primary);
            font-family: inherit;
            background: transparent;
        }

        .serving-unit-label {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-main);
            padding-right: 0.35rem;
        }

        .serving-presets-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.65rem;
            margin-top: 0.95rem;
            padding-top: 0.85rem;
            border-top: 1px dashed #FECACA;
        }

        .preset-chips {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .preset-chip {
            padding: 0.32rem 0.75rem;
            border-radius: 50px;
            border: 1px solid #E5E7EB;
            background: white;
            font-size: 0.82rem;
            font-weight: 600;
            color: #4B5563;
            cursor: pointer;
            transition: var(--transition);
        }

        .preset-chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .smart-scale-toggle {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            font-size: 0.83rem;
            font-weight: 700;
            color: #1D3557;
            cursor: pointer;
            user-select: none;
            background: white;
            padding: 0.35rem 0.75rem;
            border-radius: 50px;
            border: 1px solid #CBD5E1;
        }

        .smart-scale-toggle input {
            accent-color: var(--teal);
            width: 16px;
            height: 16px;
        }

        .smart-scale-banner {
            margin-top: 0.75rem;
            background: #ECFEFF;
            border: 1px solid #A5F3FC;
            color: #0E7490;
            padding: 0.6rem 0.9rem;
            border-radius: 10px;
            font-size: 0.83rem;
            line-height: 1.45;
            display: none;
        }

        .smart-scale-banner.visible {
            display: block;
        }

        /* Ingredients Grid */
        .recipe-section {
            margin-bottom: 2.2rem;
        }

        .recipe-section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 0.6rem;
            margin-bottom: 1rem;
        }

        .recipe-section h4 {
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: var(--primary);
            margin: 0;
        }

        .ingredients-list {
            display: grid;

        .step-checkbox {

        .step-item.completed .step-checkbox {

            border-color: var(--primary);
            color: white;

        .step-item.completed .step-text {

        .modal-hero-banner {

        .step-guide-figure {

        .image-lightbox {

        /* ==========================================

        .t-btn {

        .status-btn.selected-unverified { border-color: #6C757D; background: #F1F3F5; color: #495057; }

        .comment-editor-wrapper {

        }

        .comment-input {
            flex: 1;
            padding: 0.72rem 0.9rem;
            border: 1px solid #D1D5DB;

            font-size: 0.92rem;

        .save-comment-btn {

            background: var(--text-main);

            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.88rem;

        /* Raw Markdown Collapsible */
        details.raw-md-details {

            border-radius: var(--border-radius);

        details.raw-md-details summary {

        .recipe-rendered-body {

        .recipe-rendered-body h1, .recipe-rendered-body h2, .recipe-rendered-body h3 {

            border-collapse: collapse;
            margin: 0.8rem 0;

        .recipe-rendered-body blockquote {

        .recipe-footer-actions a {

            align-items: center;

        /* Toast notification */
        .toast-notify {
            position: fixed;
            top: calc(1.2rem + var(--safe-top));

            color: white;
            padding: 0.72rem 1.3rem;
            border-radius: 50px;
            font-size: 0.88rem;
            font-weight: 600;

            z-index: 2500;

            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            max-width: 92vw;
            text-align: center;
        }

        .toast-notify.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .status-message {
            text-align: center;
            padding: 3.5rem 1rem;
            color: var(--text-muted);
            font-size: 1.08rem;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 640px) {
            .container { padding: 1.4rem 1rem; }
            header h1 { font-size: 2.1rem; }
            .modal-content { height: 100vh; max-width: 100%; border-radius: 0; }
            .modal-body { padding: 1.1rem 1.05rem 2.5rem; }
            .recipe-header h2 { font-size: 1.55rem; }
            .serving-top-row { flex-direction: column; align-items: stretch; }
            .serving-stepper { justify-content: space-between; }
            .ingredients-list { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>김용훈의 레시피</h1>
        <p>인분 자동 계산 · 베리에이션 · 스마트 타이머 레시피 북 <span style="display:inline-block; background:#ECFDF5; color:#047857; border:1px solid #A7F3D0; font-size:0.75rem; font-weight:700; padding:0.1rem 0.5rem; border-radius:50px; vertical-align:middle; margin-left:0.3rem;">v1.3 · 자동 동기화</span></p>
        <div class="header-bar-actions">
            <a id="apk-download-link" class="apk-download-btn" href="https://github.com/ddkkinf/cookbook/releases/latest/download/kim-cookbook.apk" onclick="this.href='https://github.com/ddkkinf/cookbook/releases/latest/download/kim-cookbook.apk?t='+Date.now()">
                📲 안드로이드 앱(APK) 다운로드
            </a>
            <button id="sync-status-btn" class="sync-pill" onclick="syncRecipesFromGitHub(true)" title="웹 최신 레시피 확인 및 동기화">
                <span id="sync-status-icon">🔄</span> <span id="sync-status-label">최신 레시피 동기화</span>
            </button>
        </div>
    </header>

    <!-- Filter Controls -->
    <div class="filter-controls">
        <div class="category-tabs" id="category-tabs">
            <button class="category-tab active" onclick="filterByCategory('all')">전체 보기</button>
        </div>
        <div class="status-tabs" id="status-tabs">
            <button class="status-tab active" data-status="all" onclick="filterByStatus('all')">전체 상태</button>
            <button class="status-tab" data-status="verified" onclick="filterByStatus('verified')">✅ 검증 완료</button>
            <button class="status-tab" data-status="needs_fix" onclick="filterByStatus('needs_fix')">⚠️ 수정 필요</button>

    </div>

    <div class="search-container">
        <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" placeholder="레시피 이름이나 재료를 검색해보세요...">
        </div>
    </div>

    <div id="recipe-grid">
        <div class="status-message">
            <p>🍳 레시피를 불러오는 중입니다...</p>
        </div>
    </div>
</div>

<!-- Recipe Detail Modal -->
<div id="recipe-modal" class="modal">
    <div class="modal-content">
        <div class="modal-sticky-topbar">
            <button id="wakelock-btn" class="wakelock-btn" onclick="toggleWakeLock()">
                🔆 화면 켜짐 유지 OFF
            </button>
            <button class="close-btn" onclick="closeModal()" aria-label="닫기">✕</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
    </div>
</div>

<!-- Floating Multi-Timer Dock -->
<div id="floating-timer-dock" class="floating-timer-dock"></div>

<!-- Toast notification popup -->

    <span id="toast-text">저장되었습니다!</span>
</div>

<!-- Fullscreen Illustration Lightbox -->
<div id="image-lightbox" class="image-lightbox" onclick="closeImageLightbox()">
    <img id="image-lightbox-img" src="" alt="" onerror="handleRecipeImgError(this, '')">
    <div id="image-lightbox-caption" class="image-lightbox-caption"></div>
</div>

<script>
    const GITHUB_REPO = 'ddkkinf/cookbook';
    const GITHUB_BRANCH = 'main';
    const PAGES_BASE_URL = 'https://ddkkinf.github.io/cookbook';
    const LOCAL_STORAGE_KEY = 'cookbook_recipe_states_v1';
    const CACHED_RECIPES_KEY = 'cookbook_cached_md_v3';
    const GITHUB_TOKEN_KEY = 'cookbook_github_pat';
    const RECENT_VIEWS_KEY = 'cookbook_recent_views_v1';
    const QUALIFIED_VIEW_MS = 30000; // 최소 30초 이상 조회 시 최근 본 레시피로 인정
    const SYNC_TIMEOUT_MS = 4500;    // 네트워크 지연 시 빠르게 로컬 보관본으로 폴백
    const AUTO_SYNC_COOLDOWN_MS = 2500;

    let allRecipes = [];
    let currentCategory = 'all';
    let currentStatus = 'all';
    let activeRecipeId = null;
    let currentServings = 1;
    let smartScaleEnabled = true;
    let activeVariationMode = 'base';
    let activeAddonIds = new Set();
    let activeViewSession = null; // { recipeId, accumulatedMs, resumedAt, qualified, intervalId }
    let activeContentHash = '';
    let activeImageHashes = (window.BUNDLED_IMAGE_HASHES && typeof window.BUNDLED_IMAGE_HASHES === 'object')
        ? { ...window.BUNDLED_IMAGE_HASHES }
        : {};
    let activeSyncCommitSha = '';
    let activeCommitEtag = '';
    let isSyncingRecipes = false;
    let lastAutoSyncMs = 0;

    const grid = document.getElementById('recipe-grid');
    const searchInput = document.getElementById('search-input');
    const categoryTabsContainer = document.getElementById('category-tabs');
    const statusTabsContainer = document.getElementById('status-tabs');
    const modal = document.getElementById('recipe-modal');
    const modalBody = document.getElementById('modal-body');

    // Inside installed Capacitor Android app, repurpose button as "최신 앱 업데이트 다운로드"
    const isNativeApp = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
    if (isNativeApp) {
        const apkLink = document.getElementById('apk-download-link');
        if (apkLink) {
            apkLink.textContent = '📲 최신 앱(APK) 업데이트 받기';
            apkLink.target = '_blank';
        }
    }

    const categoryMap = {
        'korean': '한식',
        'western': '양식',
        'japanese': '일식',
        'chinese': '중식',
        'dessert': '디저트/베이킹',
        'snack': '분식/간식',
        'etc': '기타'
    };

    function detectIcon(title) {
        if (/떡볶이|오뎅|어묵|순대|튀김/.test(title)) return '🥘';
        if (/고등어|생선|갈치|연어|회|해물|조개|새우/.test(title)) return '🐟';
        if (/제육|고기|삼겹살|스테이크|소고기|돼지|갈비|불고기/.test(title)) return '🥩';
        if (/치킨|닭|백숙|삼계탕/.test(title)) return '🍗';
        if (/파스타|스파게티|면|라멘|국수|우동/.test(title)) return '🍝';
        if (/부타동|밥|볶음밥|비빔밥|덮밥|카레/.test(title)) return '🍚';
        if (/찌개|탕|국|전골/.test(title)) return '🍲';
        if (/샐러드|채소|야채/.test(title)) return '🥗';
        if (/빵|토스트|샌드위치/.test(title)) return '🥪';
        if (/케이크|쿠키|디저트|커피|음료/.test(title)) return '🍰';
        return '🍳';
    }

    // =========================================================================
    // 1. SMART CULINARY SCALING ENGINE (인분 계산 & 비선형 양념 비율 보정)
    // =========================================================================

    function parseBaseServings(servingsStr) {
        if (!servingsStr) return 1;
        // e.g. "2인분 기준", "1~2인분" -> take first number (1 or 2)
        const rangeMatch = servingsStr.match(/(\d+(?:\.\d+)?)\s*[~-]\s*(\d+(?:\.\d+)?)\s*인분/);
        if (rangeMatch) return parseFloat(rangeMatch[1]);
        const singleMatch = servingsStr.match(/(\d+(?:\.\d+)?)\s*인분/);
        if (singleMatch) return parseFloat(singleMatch[1]);
        return 1;
    }

    /**
     * Classify an ingredient into culinary scaling behavior:
     * - 'oil': 팬 코팅용 기름 (팬 면적 고정으로 완만하게 증가)
     * - 'liquid': 국물/육수용 물 (100ml 이상이거나 육수 — 증발량 차이 보정)
     * - 'coating': 부침가루/전분/밀가루 (겉면 코팅 후 털어내는 여분 보정)
     * - 'strong_seasoning': 소금, 간장, 고추장, 굴소스, 다시다 등 고염도 양념 (다인분 염도 누적 방지)
     * - 'mild_seasoning': 설탕, 물엿, 고춧가루, 맛술, 청주, 다진 마늘, 참기름 등 보조 양념
     * - 'main': 고기, 생선, 떡, 밥, 채소 등 주재료 (정비례 n배)
     */
    function classifyIngredientRole(name, amount, sectionTitle = '') {
        const n = name.replace(/\s+/g, '');
        if (/식용유|포도씨유|카놀라유|올리브유|기름/.test(n) && !/참기름|들기름|고추기름/.test(n)) {
            return 'oil';
        }
        if (/^(?:물|육수|멸치육수|다시마물)/.test(n) || /물\(또는육수\)|물\(사리용추가\)/.test(n)) {
            // Check if it's broth-level water (>= 80ml) vs 2~3큰술 splash
            const mlMatch = amount.match(/(\d+)\s*(?:ml|g|컵)/i);
            if (mlMatch && parseFloat(mlMatch[1]) >= 80) {
                return 'liquid';
            }
        }
        if (/부침가루|전분|밀가루|튀김가루|녹말/.test(n)) {
            return 'coating';
        }
        if (/소금|맛소금|꽃소금|천일염|진간장|국간장|간장|고추장|된장|쌈장|굴소스|다시다|치킨스톡|액젓|까나리|멸치액젓|연두|미원|소고기다시다/.test(n)) {
            return 'strong_seasoning';
        }
        if (/설탕|황설탕|물엿|올리고당|꿀|매실청|고춧가루|맛술|미림|청주|소주|참기름|들기름|버터|케첩|마요네즈|바질페스토|파마산|다진마늘|생강|식초|후추|후춧가루|레몬즙|와사비/.test(n) || /양념|소스/.test(sectionTitle)) {
            // Avoid misclassifying main items if sectionTitle had 소스
            if (!/고기|삼겹살|목살|앞다리|갈치|고등어|떡|어묵|라면|파스타|스파게티|새우|베이컨|양송이|토마토|양파|대파|밥|달걀|계란|스팸|참치|김치/.test(n)) {
                return 'mild_seasoning';
            }
        }
        return 'main';
    }

    function getSmartScaleFactor(role, rawRatio, smartEnabled) {
        if (!smartEnabled || Math.abs(rawRatio - 1) < 0.001) {
            return { factor: rawRatio, reason: null };
        }
        if (role === 'oil') {
            const factor = rawRatio > 1
                ? 1 + (rawRatio - 1) * 0.45
                : Math.max(0.6, 1 - (1 - rawRatio) * 0.5);
            return { factor, reason: '🍳 팬 코팅유 비율 보정' };
        }
        if (role === 'liquid') {
            const factor = rawRatio > 1
                ? 1 + (rawRatio - 1) * 0.80
                : 1 - (1 - rawRatio) * 0.78;
            return { factor, reason: '💧 냄비 증발량 보정' };
        }
        if (role === 'coating') {
            const factor = rawRatio > 1
                ? Math.pow(rawRatio, 0.82)
                : Math.max(0.6, Math.pow(rawRatio, 0.85));
            return { factor, reason: '🌾 가루 코팅 여분 보정' };
        }
        if (role === 'strong_seasoning') {
            const factor = rawRatio > 1
                ? Math.pow(rawRatio, 0.85)
                : Math.pow(rawRatio, 0.90);
            return { factor, reason: '🧂 염도·간 과다 방지 보정' };
        }
        if (role === 'mild_seasoning') {
            const factor = rawRatio > 1
                ? Math.pow(rawRatio, 0.90)
                : Math.pow(rawRatio, 0.93);
            return { factor, reason: '✨ 양념 밸런스 보정' };
        }
        return { factor: rawRatio, reason: null };
    }

    function parseNumToken(token) {
        const t = token.trim();
        if (t.includes('/')) {
            const [num, den] = t.split('/').map(Number);
            if (den) return num / den;
        }
        return parseFloat(t);
    }

    function formatScaledNumber(val, unit) {
        const u = (unit || '').trim();
        if (val <= 0) return '약간';

        // Grams or milliliters
        if (/^(?:g|ml|cc)\b/i.test(u)) {
            if (val >= 100) return String(Math.round(val / 5) * 5);
            if (val >= 10) return String(Math.round(val));
            const half = Math.round(val * 2) / 2;
            return String(half || 0.5);
        }

        // Spoons / cups / bowls (clean 0.1 decimal, e.g. 0.5, 1.5, 1.8, 3.6)
        if (/큰술|작은술|스푼|컵|공기|줌/.test(u)) {
            if (val < 0.2) return '0.2';
            const tenth = Math.round(val * 10) / 10;
            return Number(tenth.toFixed(1)).toString();
        }

        // Countable items (개, 장, 쪽, 토막, 대, 꼬집, 캔)
        if (/꼬집|번/.test(u)) {
            return String(Math.max(1, Math.round(val)));
        }

        const half = Math.round(val * 2) / 2;
        if (Math.abs(val - half) <= 0.12) {
            return Number(half.toFixed(1)).toString();
        }
        return Number((Math.round(val * 10) / 10).toFixed(1)).toString();
    }

    function scaleAmountText(amountText, factor) {
        if (!amountText || Math.abs(factor - 1) < 0.01) return amountText;
        // Skip purely descriptive strings
        if (!/\d/.test(amountText)) return amountText;

        // Match ranges like "10~12g", "1/2~1개", "0.75~1큰술" or single numbers "2큰술", "1/2개", "300g"
        const numPattern = /(\d+\s*\/\s*\d+|\d+(?:\.\d+)?)(?:\s*([~-])\s*(\d+\s*\/\s*\d+|\d+(?:\.\d+)?))?(\s*[가-힣a-zA-Z°%]*)/g;

        return amountText.replace(numPattern, (fullMatch, n1, sep, n2, unitPart) => {
            const unitTrim = (unitPart || '').trim();
            // Do not scale thickness/length/temperature/time descriptors if any appear
            if (/^(?:mm|cm|°C|도|분|초|%)/i.test(unitTrim)) {
                return fullMatch;
            }
            const v1 = parseNumToken(n1) * factor;
            if (sep && n2) {
                const v2 = parseNumToken(n2) * factor;
                const s1 = formatScaledNumber(v1, unitTrim);
                const s2 = formatScaledNumber(v2, unitTrim);
                if (s1 === s2) return `${s1}${unitPart}`;
                return `${s1}${sep}${s2}${unitPart}`;
            }
            const s1 = formatScaledNumber(v1, unitTrim);
            return `${s1}${unitPart}`;
        });
    }

    // =========================================================================
    // 2. SMART TIMER DETECTOR & MULTI-TIMER ENGINE (Web Audio + Vibration)
    // =========================================================================

    let activeTimers = []; // { id, label, totalSec, remainingMs, endTime, running, finished }
    let timerTickInterval = null;
    let alarmAudioInterval = null;
    let audioCtx = null;

    function extractTimersFromStep(stepTitle, plainText) {
        const timers = [];
        const seenSeconds = new Set();

        // Clean out long marinating phrases like "24시간" or "30분 ~ 하루" from quick frying timers unless reasonable
        // 1) "N분 M초 ~ K분" or "N분 M초"
        const minSecRegex = /(\d+)\s*분\s*(\d+)\s*초(?:\s*[~-]\s*(\d+)\s*분(?:\s*(\d+)\s*초)?)?/g;
        let cleaned = plainText;

        cleaned = cleaned.replace(minSecRegex, (match, m1, s1, m2, s2) => {
            const sec1 = parseInt(m1, 10) * 60 + parseInt(s1, 10);
            if (sec1 > 0 && sec1 <= 7200 && !seenSeconds.has(sec1)) {
                seenSeconds.add(sec1);
                timers.push({ seconds: sec1, display: `${m1}분 ${s1}초` });
            }
            if (m2) {
                const sec2 = parseInt(m2, 10) * 60 + (s2 ? parseInt(s2, 10) : 0);
                if (sec2 > 0 && sec2 <= 7200 && !seenSeconds.has(sec2)) {
                    seenSeconds.add(sec2);
                    timers.push({ seconds: sec2, display: s2 ? `${m2}분 ${s2}초` : `${m2}분` });
                }
            }
            return ' ';
        });

        // 2) Range or single minutes: "3~4분", "10분", "1~2분"
        const minRegex = /(\d+)\s*(?:[~-]\s*(\d+)\s*)?분(?!\s*량)/g;
        cleaned = cleaned.replace(minRegex, (match, m1, m2) => {
            const v1 = parseInt(m1, 10);
            const v2 = m2 ? parseInt(m2, 10) : null;
            if (v2) {
                // Offer start of range and upper bound (or midpoint if 1 min apart)
                const sec1 = v1 * 60;
                const sec2 = v2 * 60;
                if (sec1 > 0 && sec1 <= 7200 && !seenSeconds.has(sec1)) {
                    seenSeconds.add(sec1);
                    timers.push({ seconds: sec1, display: `${v1}분` });
                }
                if (sec2 > 0 && sec2 <= 7200 && !seenSeconds.has(sec2)) {
                    seenSeconds.add(sec2);
                    timers.push({ seconds: sec2, display: `${v2}분` });
                }
            } else if (v1 > 0 && v1 <= 120) {
                const sec = v1 * 60;
                if (!seenSeconds.has(sec)) {
                    seenSeconds.add(sec);
                    timers.push({ seconds: sec, display: `${v1}분` });
                }
            }
            return ' ';
        });

        // 3) Seconds: "30초", "10~15초", "5~10초"
        const secRegex = /(\d+)\s*(?:[~-]\s*(\d+)\s*)?초/g;
        cleaned.replace(secRegex, (match, s1, s2) => {
            const targetSec = s2 ? parseInt(s2, 10) : parseInt(s1, 10);
            if (targetSec >= 5 && targetSec <= 300 && !seenSeconds.has(targetSec)) {
                seenSeconds.add(targetSec);
                timers.push({ seconds: targetSec, display: `${targetSec}초` });
            }
            return ' ';
        });

        return timers.map(t => ({
            ...t,
            label: `${stepTitle} (${t.display})`
        }));
    }

    function ensureAudioContext() {
        try {
            if (!audioCtx) {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (Ctx) audioCtx = new Ctx();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        } catch (e) {
            console.warn('AudioContext unavailable:', e);
        }
    }

    function playKitchenBeepPattern() {
        ensureAudioContext();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        // Crisp 3-beep kitchen timer chime (A5 - A5 - E6)
        const notes = [
            { freq: 880, offset: 0, dur: 0.11 },
            { freq: 880, offset: 0.16, dur: 0.11 },
            { freq: 1318.5, offset: 0.32, dur: 0.22 }
        ];
        notes.forEach(n => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(n.freq, now + n.offset);
            gain.gain.setValueAtTime(0.001, now + n.offset);
            gain.gain.exponentialRampToValueAtTime(0.35, now + n.offset + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, now + n.offset + n.dur);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + n.offset);
            osc.stop(now + n.offset + n.dur + 0.02);
        });
        if (navigator.vibrate) {
            navigator.vibrate([300, 150, 300, 150, 500]);
        }
    }

    function syncAlarmLoop() {
        const anyFinished = activeTimers.some(t => t.finished);
        if (anyFinished && !alarmAudioInterval) {
            playKitchenBeepPattern();
            let count = 0;
            alarmAudioInterval = setInterval(() => {
                count++;
                if (!activeTimers.some(t => t.finished) || count > 12) {
                    clearInterval(alarmAudioInterval);
                    alarmAudioInterval = null;
                    return;
                }
                playKitchenBeepPattern();
            }, 1400);
        } else if (!anyFinished && alarmAudioInterval) {
            clearInterval(alarmAudioInterval);
            alarmAudioInterval = null;
        }
    }

    function startCookingTimer(seconds, label, event) {
        if (event) event.stopPropagation();
        ensureAudioContext();
        requestWakeLockAutomatically();

        const id = 't_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
        const totalMs = seconds * 1000;
        activeTimers.push({
            id,
            label: label || `${Math.floor(seconds / 60)}분 타이머`,
            totalMs,
            remainingMs: totalMs,
            endTime: Date.now() + totalMs,
            running: true,
            finished: false
        });

        ensureTimerLoop();
        renderTimerDock();
        showToast(`⏱️ '${label}' 타이머가 시작되었습니다!`);
    }

    function openCustomTimerPrompt() {
        const input = prompt('타이머 시간을 분 단위로 입력하세요 (예: 3, 1.5, 0.5 = 30초):', '3');
        if (input === null) return;
        const mins = parseFloat(input);
        if (isNaN(mins) || mins <= 0) {
            showToast('올바른 시간을 입력해 주세요.');
            return;
        }
        const secs = Math.round(mins * 60);
        const recipe = allRecipes.find(r => r.id === activeRecipeId);
        const prefix = recipe ? recipe.title : '직접 설정';
        startCookingTimer(secs, `${prefix} (${mins}분)`);
    }

    function toggleTimerPause(id) {
        const t = activeTimers.find(x => x.id === id);
        if (!t) return;
        if (t.finished) {
            dismissTimer(id);
            return;
        }
        if (t.running) {
            t.remainingMs = Math.max(0, t.endTime - Date.now());
            t.running = false;
        } else {
            t.endTime = Date.now() + t.remainingMs;
            t.running = true;
            ensureAudioContext();
        }
        renderTimerDock();
    }

    function addTimerSeconds(id, addSec) {
        const t = activeTimers.find(x => x.id === id);
        if (!t) return;
        const addMs = addSec * 1000;
        if (t.finished) {
            t.finished = false;
            t.running = true;
            t.remainingMs = addMs;
            t.totalMs = addMs;
            t.endTime = Date.now() + addMs;
            syncAlarmLoop();
        } else if (t.running) {
            t.endTime += addMs;
            t.remainingMs = Math.max(0, t.endTime - Date.now());
            t.totalMs = Math.max(t.totalMs, t.remainingMs);
        } else {
            t.remainingMs += addMs;
            t.totalMs = Math.max(t.totalMs, t.remainingMs);
        }
        ensureTimerLoop();
        renderTimerDock();
    }

    function dismissTimer(id) {
        activeTimers = activeTimers.filter(x => x.id !== id);
        syncAlarmLoop();
        renderTimerDock();
    }

    function formatClock(ms) {
        const totalSec = Math.ceil(Math.max(0, ms) / 1000);
        const m = Math.floor(totalSec / 60);
        const s = totalSec % 60;
        return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function ensureTimerLoop() {
        if (timerTickInterval) return;
        timerTickInterval = setInterval(() => {
            if (activeTimers.length === 0) {
                clearInterval(timerTickInterval);
                timerTickInterval = null;
                return;
            }
            const now = Date.now();
            let stateChanged = false;

            activeTimers.forEach(t => {
                if (t.running && !t.finished) {
                    t.remainingMs = Math.max(0, t.endTime - now);
                    if (t.remainingMs <= 0) {
                        t.running = false;
                        t.finished = true;
                        stateChanged = true;
                    }
                }
            });

            if (stateChanged) {
                syncAlarmLoop();
            }
            renderTimerDock();
        }, 250);
    }

    function renderTimerDock() {
        const dock = document.getElementById('floating-timer-dock');
        if (!dock) return;
        if (activeTimers.length === 0) {
            dock.classList.remove('active');
            dock.innerHTML = '';
            return;
        }
        dock.classList.add('active');
        dock.innerHTML = activeTimers.map(t => {
            const pct = t.totalMs > 0 ? Math.max(0, Math.min(100, (t.remainingMs / t.totalMs) * 100)) : 0;
            if (t.finished) {
                return `
                    <div class="timer-card finished">
                        <div class="timer-card-main">
                            <div class="timer-info">
                                <div class="timer-label">🔔 조리 시간 완료! · ${t.label}</div>
                                <div class="timer-digits">00:00 완료!</div>
                            </div>
                            <div class="timer-controls">
                                <button class="t-btn" onclick="addTimerSeconds('${t.id}', 60)">+1분 더</button>
                                <button class="t-btn stop-alarm" onclick="dismissTimer('${t.id}')">알람 끄기</button>
                            </div>
                        </div>
                    </div>
                `;
            }
            return `
                <div class="timer-card">
                    <div class="timer-card-main">
                        <div class="timer-info">
                            <div class="timer-label">⏱️ ${t.label}</div>
                            <div class="timer-digits">${formatClock(t.remainingMs)}</div>
                        </div>
                        <div class="timer-controls">
                            <button class="t-btn primary" onclick="toggleTimerPause('${t.id}')">${t.running ? '⏸ 일시정지' : '▶ 재개'}</button>
                            <button class="t-btn" onclick="addTimerSeconds('${t.id}', 30)">+30초</button>
                            <button class="t-btn" onclick="addTimerSeconds('${t.id}', 60)">+1분</button>
                            <button class="t-btn" onclick="dismissTimer('${t.id}')" aria-label="타이머 삭제">✕</button>
                        </div>
                    </div>
                    <div class="timer-progress-track">
                        <div class="timer-progress-bar" style="width: ${pct}%;"></div>
                    </div>
                </div>
            `;
        }).join('');
    }

    // Screen Wake Lock (조리 중 화면 꺼짐 방지)
    let wakeLockSentinel = null;
    let wakeLockWanted = false;

    async function requestWakeLockAutomatically() {
        if (!('wakeLock' in navigator)) return;
        try {
            if (!wakeLockSentinel) {
                wakeLockSentinel = await navigator.wakeLock.request('screen');
                wakeLockWanted = true;
                wakeLockSentinel.addEventListener('release', () => {
                    wakeLockSentinel = null;
                    updateWakeLockButtonUI();
                });
                updateWakeLockButtonUI();
            }
        } catch (_) {}
    }

    async function toggleWakeLock() {
        if (!('wakeLock' in navigator)) {
            showToast('이 기기/브라우저에서는 화면 자동 켜짐 유지를 지원하지 않습니다.');
            return;
        }
        if (wakeLockSentinel) {
            wakeLockWanted = false;
            await wakeLockSentinel.release();
            wakeLockSentinel = null;
            updateWakeLockButtonUI();
            showToast('화면 켜짐 유지가 해제되었습니다.');
        } else {
            await requestWakeLockAutomatically();
            if (wakeLockSentinel) {
                showToast('🔆 조리 중 화면이 꺼지지 않도록 유지합니다!');
            }
        }
    }

    function updateWakeLockButtonUI() {
        const btn = document.getElementById('wakelock-btn');
        if (!btn) return;
        if (wakeLockSentinel) {
            btn.classList.add('active');
            btn.textContent = '🔆 화면 켜짐 유지 ON';
        } else {
            btn.classList.remove('active');
            btn.textContent = '🔆 화면 켜짐 유지 OFF';
        }
    }

    // =========================================================================
    // 2.5. 30-SECOND QUALIFIED RECENT VIEW TRACKER (30초 이상 조회 시 최상단 정렬)
    // =========================================================================

    function getRecentViewsMap() {
        try {
            const raw = localStorage.getItem(RECENT_VIEWS_KEY);
            return raw ? (JSON.parse(raw) || {}) : {};
        } catch (_) {
            return {};
        }
    }

    function recordQualifiedRecentView(recipeId, timestampMs = Date.now()) {
        if (!recipeId) return;
        try {
            const map = getRecentViewsMap();
            map[recipeId] = timestampMs;
            localStorage.setItem(RECENT_VIEWS_KEY, JSON.stringify(map));
        } catch (_) {}
    }

    function getCurrentSessionVisibleMs(session) {
        if (!session) return 0;
        const activeDelta = session.resumedAt ? Math.max(0, Date.now() - session.resumedAt) : 0;
        return session.accumulatedMs + activeDelta;
    }

    function startRecipeViewTracker(recipeId) {
        finalizeRecipeViewTracker();
        const isVisible = document.visibilityState !== 'hidden';
        const session = {
            recipeId,
            accumulatedMs: 0,
            resumedAt: isVisible ? Date.now() : null,
            qualified: false,
            intervalId: null
        };
        session.intervalId = setInterval(() => {
            if (!activeViewSession || activeViewSession !== session) return;
            const elapsed = getCurrentSessionVisibleMs(session);
            if (!session.qualified && elapsed >= QUALIFIED_VIEW_MS) {
                session.qualified = true;
                recordQualifiedRecentView(session.recipeId, Date.now());
                applyFilter();
            }
        }, 1000);
        activeViewSession = session;
    }

    function finalizeRecipeViewTracker() {
        if (!activeViewSession) return false;
        const session = activeViewSession;
        activeViewSession = null;
        if (session.intervalId) clearInterval(session.intervalId);
        const elapsed = getCurrentSessionVisibleMs(session);
        if (session.qualified || elapsed >= QUALIFIED_VIEW_MS) {
            recordQualifiedRecentView(session.recipeId, Date.now());
            applyFilter();
            return true;
        }
        return false;
    }

    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {

                requestWakeLockAutomatically();

            if (activeViewSession && modal.classList.contains('active') && !activeViewSession.resumedAt) {
                activeViewSession.resumedAt = Date.now();
            }
        } else {
            if (activeViewSession && activeViewSession.resumedAt) {
                activeViewSession.accumulatedMs += Math.max(0, Date.now() - activeViewSession.resumedAt);
                activeViewSession.resumedAt = null;
            }
        }
    });

    function extractImageRelPath(rawOrResolved) {
        if (!rawOrResolved) return '';
        const clean = rawOrResolved.split('?')[0].split('#')[0].trim();
        const docsIdx = clean.indexOf('docs/images/');
        if (docsIdx >= 0) return clean.slice(docsIdx + 'docs/'.length);
        const pagesIdx = clean.indexOf('/cookbook/images/');
        if (pagesIdx >= 0) return clean.slice(pagesIdx + '/cookbook/'.length);
        if (clean.startsWith('./images/')) return clean.slice(2);
        if (clean.startsWith('images/')) return clean;
        return '';
    }

    function resolveRecipeImageUrl(rawSrc) {
        if (!rawSrc) return '';
        const s = rawSrc.trim();
        if (/^https?:\/\//i.test(s)) return s;

        const relPath = extractImageRelPath(s);
        if (!relPath) return s;

        const bundledMap = (window.BUNDLED_IMAGE_HASHES && typeof window.BUNDLED_IMAGE_HASHES === 'object')
            ? window.BUNDLED_IMAGE_HASHES
            : {};
        const bundledHash = bundledMap[relPath];
        const remoteHash = (activeImageHashes && typeof activeImageHashes === 'object')
            ? activeImageHashes[relPath]
            : undefined;

        // 1) If bundled locally inside APK/Web AND unchanged on web -> instant 0ms local asset!
        if (bundledHash && (!remoteHash || bundledHash === remoteHash)) {
            return './' + relPath;
        }

        // 2) New recipe image added on web OR existing image updated on web -> load latest web version!
        if (activeSyncCommitSha) {
            return `https://raw.githubusercontent.com/${GITHUB_REPO}/${activeSyncCommitSha}/docs/${relPath}`;
        }
        const bust = remoteHash ? `?v=${remoteHash}` : '';
        return `${PAGES_BASE_URL}/${relPath}${bust}`;
    }

    function handleRecipeImgError(imgEl, fallbackEmoji) {
        if (!imgEl) return;
        const currentSrc = imgEl.getAttribute('src') || '';
        const relPath = extractImageRelPath(currentSrc);

        // Fallback A: Local asset missing -> try GitHub Pages online image
        if (!imgEl.dataset.triedRemote && currentSrc.startsWith('./images/') && relPath) {
            imgEl.dataset.triedRemote = '1';
            const remoteHash = (activeImageHashes && activeImageHashes[relPath]) ? `?v=${activeImageHashes[relPath]}` : '';
            imgEl.src = `${PAGES_BASE_URL}/${relPath}${remoteHash}`;
            return;
        }

        // Fallback B: Raw GitHub URL failed -> try GitHub Pages CDN
        if (!imgEl.dataset.triedPages && currentSrc.includes('raw.githubusercontent.com') && relPath) {
            imgEl.dataset.triedPages = '1';
            const remoteHash = (activeImageHashes && activeImageHashes[relPath]) ? `?v=${activeImageHashes[relPath]}` : '';
            imgEl.src = `${PAGES_BASE_URL}/${relPath}${remoteHash}`;
            return;
        }

        // Fallback C: Offline so remote URL failed -> fall back to bundled local APK image if present!
        const bundledMap = window.BUNDLED_IMAGE_HASHES || {};
        if (!imgEl.dataset.triedLocal && /^https?:\/\//i.test(currentSrc) && relPath && bundledMap[relPath]) {
            imgEl.dataset.triedLocal = '1';
            imgEl.src = `./${relPath}`;
            return;
        }

        // Final graceful fallback (emoji on card, or hide figure container cleanly)
        if (fallbackEmoji && imgEl.parentElement) {
            imgEl.style.display = 'none';
            const span = document.createElement('span');
            span.textContent = fallbackEmoji;
            imgEl.parentElement.insertBefore(span, imgEl);
        } else if (imgEl.closest('.step-guide-figure')) {
            imgEl.closest('.step-guide-figure').style.display = 'none';
        } else if (imgEl.closest('.modal-hero-banner')) {
            imgEl.closest('.modal-hero-banner').style.display = 'none';
        } else {
            imgEl.style.display = 'none';
        }
    }

    function openImageLightboxFromContainer(containerEl, fallbackSrc, caption, event) {
        if (event) event.stopPropagation();
        const innerImg = containerEl ? containerEl.querySelector('img') : null;
        const liveSrc = (innerImg && (innerImg.currentSrc || innerImg.getAttribute('src'))) || fallbackSrc;
        openImageLightbox(liveSrc, caption, event);

    function openImageLightbox(src, caption, event) {
        if (event) event.stopPropagation();
        const box = document.getElementById('image-lightbox');
        const img = document.getElementById('image-lightbox-img');
        const cap = document.getElementById('image-lightbox-caption');

        delete img.dataset.triedPages;
        delete img.dataset.triedLocal;
        img.style.display = '';
        img.src = src;
        img.alt = caption || '';
        if (cap) cap.textContent = caption ? `🎨 ${caption} (화면을 터치하면 닫힙니다)` : '화면을 터치하면 닫힙니다';
        box.classList.add('active');

    function closeImageLightbox() {
        const box = document.getElementById('image-lightbox');

    function formatInlineMd(text) {
        return text
            .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
            .replace(/\*([^*]+)\*/g, '<em>$1</em>')
            .replace(/`([^`]+)`/g, '<code>$1</code>');
    }

    function parseTableRowsIntoIngredients(textBlock, sectionTitle = '') {
        const list = [];
        const tableRows = textBlock.matchAll(/^\|\s*([^|]+)\|\s*([^|]+)\|(?:\s*([^|]*)\|)?/gm);
        for (const match of tableRows) {
            const name = match[1].replace(/\*\*/g, '').trim();
            const amount = match[2].replace(/\*\*/g, '').trim();
            const note = (match[3] || '').replace(/\*\*/g, '').replace(/\*/g, '').trim();
            if (name && !/^(?:재료|양념\s*재료|품목)$/.test(name) && !name.includes('---') && !amount.includes('---')) {
                const role = classifyIngredientRole(name, amount, sectionTitle);
                list.push({ name, amount, note, role, group: sectionTitle });
            }
        }
        return list;
    }

    function parseStepBlocks(scopeText, hashes = '###', timerPrefix = 'Step') {
        const parsedSteps = [];
        const splitRegex = new RegExp(`(?=^${hashes}\\s+Step\\s*\\d+)`, 'mi');
        const headerRegex = new RegExp(`^${hashes}\\s+(Step\\s*\\d+[^.\\n]*\\.?\\s*[^\\n]+)\\n?([\\s\\S]*)$`, 'i');
        let counter = 0;

        for (const chunk of scopeText.split(splitRegex)) {
            const match = chunk.trim().match(headerRegex);
            if (!match) continue;
            counter++;
            const rawStepHeader = match[1].replace(/^Step\s*\d+\s*\.?\s*/i, '').trim();
            const stepTitle = formatInlineMd(rawStepHeader);
            // Stop at horizontal rule '---' or next H2 '## ' if present
            const rawBody = match[2].split(/\n---|\n##\s/)[0].trim();

            const stepImages = [];
            const textOnlyLines = [];
            for (const rawLine of rawBody.split('\n')) {
                const l = rawLine.trim();
                if (!l || l.startsWith('>')) continue;
                const imgMatch = l.match(/^!\[([^\]]*)\]\(([^)]+)\)$/);
                if (imgMatch) {
                    stepImages.push({
                        alt: imgMatch[1].trim() || `${rawStepHeader} 참고 그림`,
                        src: resolveRecipeImageUrl(imgMatch[2])
                    });
                    continue;
                }
                textOnlyLines.push(l);
            }

            const stepLines = textOnlyLines.map(l => {
                if (/^[*-]\s+/.test(l)) {
                    return '&nbsp;&nbsp;• ' + formatInlineMd(l.replace(/^[*-]\s+/, ''));
                }
                return formatInlineMd(l);
            });
            const stepBodyHtml = stepLines.join('<br>');
            const plainForTimer = textOnlyLines.join('\n').replace(/[*_`>#]/g, '');
            const timers = extractTimersFromStep(`${timerPrefix} ${counter}`, plainForTimer);

            parsedSteps.push({
                index: counter,
                titleHtml: stepTitle,
                bodyHtml: stepBodyHtml,
                images: stepImages,
                timers
            });
        }
        return parsedSteps;
    }

    function parseRecipeMarkdown(mdContent, filePath) {
        const parts = filePath.split('/');
        let folderCategory = '기타';
        if (parts.length >= 3) {
            const rawCat = parts[1].toLowerCase();
            folderCategory = categoryMap[rawCat] || rawCat;
        }

        const titleMatch = mdContent.match(/^#\s+(.+)$/m);
        let rawTitle = titleMatch ? titleMatch[1].trim() : parts[parts.length - 1].replace(/\.md$/i, '');

        let icon = null;
        const emojiMatch = rawTitle.match(/^([\uD800-\uDBFF][\uDC00-\uDFFF]|[\u2600-\u27BF]|\uFE0F|[\u{1F300}-\u{1F9FF}])/u);
        if (emojiMatch) {
            icon = emojiMatch[0];
            rawTitle = rawTitle.replace(emojiMatch[0], '').trim();
        }
        const cleanTitle = rawTitle.replace(/\s+레시피$/, '').trim();
        if (!icon) icon = detectIcon(cleanTitle);

        let description = '맛있는 정성 가득 홈메이드 레시피';
        const overviewSection = mdContent.match(/##\s*📌?\s*개요\s*\n([\s\S]*?)(?=\n##|$)/);
        if (overviewSection) {
            const firstLine = overviewSection[1].split('\n').map(l => l.trim()).find(l => l && !l.startsWith('*') && !l.startsWith('-') && !l.startsWith('!['));
            if (firstLine) description = firstLine;
        }

        // Extract top hero illustration if placed before the first H2 section
        let heroImage = '';
        let heroImageAlt = cleanTitle;
        const introBlock = mdContent.split(/\n##\s/)[0] || '';
        const heroImgMatch = introBlock.match(/!\[([^\]]*)\]\(([^)]+)\)/);
        if (heroImgMatch) {
            heroImageAlt = heroImgMatch[1].trim() || cleanTitle;
            heroImage = resolveRecipeImageUrl(heroImgMatch[2]);
        }

        function extractMeta(regex, defaultValue) {
            const m = mdContent.match(regex);
            return (m && m[1]) ? m[1].replace(/\*\*/g, '').trim() : defaultValue;
        }

        const servings = extractMeta(/(?:조리\s*분량|분량)[^*:\n]*[:*]+\s*([^\n*]+)/i, '1인분');
        const baseServings = parseBaseServings(servings);
        const time = extractMeta(/(?:조리\s*시간|소요\s*시간)[^*:\n]*[:*]+\s*([^\n*]+)/i, '15분');
        const difficulty = extractMeta(/난이도[^*:\n]*[:*]+\s*([^\n*]+)/i, '쉬움');
        const category = extractMeta(/(?:분류|카테고리)[^*:\n]*[:*]+\s*([^\n*]+)/i, folderCategory);

        const rawStatus = extractMeta(/(?:검증\s*상태|검증|상태)[^*:\n]*[:*]+\s*([^\n*]+)/i, '');
        let status = 'unverified';
        let statusText = '미검증';
        if (/완료|성공|통과|검증됨|pass|verified|ok/i.test(rawStatus)) {
            status = 'verified';
            statusText = '검증 완료';
        } else if (/수정|필요|주의|실패|fail|fix/i.test(rawStatus)) {
            status = 'needs_fix';
            statusText = '수정 필요';
        }

        const commentMatch = mdContent.match(/^[*-]?\s*\*\*?(?:코멘트|메모|피드백|노트|comment)[^*:\n\r]*[:*]+[ \t]*([^\r\n]+)/im);
        let comment = (commentMatch && commentMatch[1]) ? commentMatch[1].replace(/\*\*/g, '').trim() : '';
        if (comment === '---' || comment === '-') comment = '';

        // Extract base ingredients section (supports BOTH tables AND bullet lists inside ## 🛒 재료)
        const ingredients = [];
        const ingSectionMatch = mdContent.match(/##\s*🛒?\s*재료[^\n]*\n([\s\S]*?)(?=\n##\s|$)/i);
        const ingScope = ingSectionMatch ? ingSectionMatch[1] : '';

        if (ingScope) {
            const subBlocks = ingScope.split(/(?=^###\s+)/m);
            for (const sub of subBlocks) {
                const subHeaderMatch = sub.match(/^###\s+([^\n]+)/);
                const subTitle = subHeaderMatch ? subHeaderMatch[1].trim() : '';

                // 1) Table rows in this subsection
                ingredients.push(...parseTableRowsIntoIngredients(sub, subTitle));

                // 2) Bullet list items in this subsection (outside blockquotes)
                const lines = sub.split('\n');
                for (const line of lines) {
                    const trimmed = line.trim();
                    if (trimmed.startsWith('>')) continue;
                    const bulletMatch = trimmed.match(/^[*-]\s+\*\*([^:*]+?)(?::\*\*|\*\*\s*:)\s*([^\n]+)/);
                    if (bulletMatch) {
                        const name = bulletMatch[1].trim();
                        let rawAmt = bulletMatch[2].trim();
                        let note = '';
                        const noteMatch = rawAmt.match(/(?:—|-|\*?\()([^*)]+)\)?\*?$/);
                        if (noteMatch && rawAmt.indexOf(noteMatch[0]) > 0) {
                            note = noteMatch[1].replace(/\*/g, '').trim();
                            rawAmt = rawAmt.slice(0, rawAmt.indexOf(noteMatch[0])).replace(/[—\-\s]+$/, '').trim();
                        }
                        rawAmt = rawAmt.replace(/\*/g, '').trim();
                        const role = classifyIngredientRole(name, rawAmt, subTitle);
                        ingredients.push({ name, amount: rawAmt, note, role, group: subTitle });
                    }
                }
            }
        }

        // Parse base step instructions strictly from ## 🍳 조리 순서 / 단계별 레시피
        const mainStepMatch = mdContent.match(/##\s*🍳?\s*(?:조리\s*순서|단계별\s*레시피)[^\n]*\n([\s\S]*?)(?=\n---\s*\n##\s|\n##\s|$)/i);
        const mainStepScope = mainStepMatch ? mainStepMatch[1] : mdContent;
        const steps = parseStepBlocks(mainStepScope, '###', 'Step');

        // Also check if there is an Air Fryer section with timed steps!
        const airFryerMatch = mdContent.match(/##\s*🍳?\s*에어프라이어[^\n]*\n([\s\S]*?)(?=\n---|(?:\n##\s)|$)/i);
        if (airFryerMatch) {
            const afBody = airFryerMatch[1].trim();
            const afLines = afBody.split('\n').map(l => l.trim()).filter(Boolean).map(formatInlineMd);
            if (afLines.length > 0) {
                steps.push({
                    index: steps.length + 1,
                    titleHtml: '에어프라이어 조리 시 (선택)',
                    bodyHtml: afLines.join('<br>'),
                    timers: extractTimersFromStep('에어프라이어', afBody.replace(/[*_`>#]/g, ''))
                });
            }
        }

        // Parse interactive variations section (## 🔄 베리에이션 -> ### [모드] / ### [옵션])
        const modes = [];
        const addons = [];
        const varSectionMatch = mdContent.match(/##\s*🔄?\s*베리에이션[^\n]*\n([\s\S]*?)(?=\n---\s*\n##\s|\n##\s|$)/i);
        if (varSectionMatch) {
            const varChunks = varSectionMatch[1].split(/(?=^###\s+\[(?:모드|옵션)\])/m);
            for (const chunk of varChunks) {
                const headerMatch = chunk.match(/^###\s+\[(모드|옵션)\]\s*([^\n]+)\n([\s\S]*)$/);
                if (!headerMatch) continue;
                const varType = headerMatch[1]; // '모드' or '옵션'
                const varTitle = headerMatch[2].trim();
                const varBody = headerMatch[3].trim();

                // Intro description lines before first table '|' or '#### Step'
                const descLines = [];
                for (const line of varBody.split('\n')) {
                    const t = line.trim();
                    if (!t || t === '---') continue;
                    if (t.startsWith('|') || t.startsWith('####')) break;
                    descLines.push(formatInlineMd(t));
                }
                const varDescHtml = descLines.join(' ');
                const varIngredients = parseTableRowsIntoIngredients(varBody, varTitle);
                const varSteps = parseStepBlocks(varBody, '####', varTitle.replace(/^[^\w가-힣]+/, '').trim() || 'Step');

                if (varType === '모드') {
                    modes.push({
                        id: `mode_${modes.length}`,
                        title: varTitle,
                        descriptionHtml: varDescHtml,
                        ingredients: varIngredients,
                        steps: varSteps
                    });
                } else {
                    addons.push({
                        id: `addon_${addons.length}`,
                        title: varTitle,
                        descriptionHtml: varDescHtml,
                        ingredients: varIngredients,
                        steps: varSteps
                    });
                }
            }
        }

        return {
            id: filePath,
            path: filePath,
            title: cleanTitle,
            description,
            heroImage,
            heroImageAlt,
            time,
            servings,
            baseServings,
            difficulty,
            category,
            ingredients,
            steps,
            modes,
            addons,
            icon,
            status,
            statusText,
            comment,
            rawMarkdown: mdContent
        };
    }
