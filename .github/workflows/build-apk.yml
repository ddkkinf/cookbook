name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: |
          SDK_MGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDK_MGR" --licenses > /dev/null || true

      - name: Persist Android debug keystore across builds for seamless app updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cookbook-android-debug-keystore-v1

      - name: Install dependencies & sync recipes into Android assets
        run: |
          npm ci
          npm run sync

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK file
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk kim-cookbook.apk
          ls -lh kim-cookbook.apk

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kim-cookbook-apk
          path: kim-cookbook.apk
          if-no-files-found: error

      - name: Publish latest APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "김용훈의 레시피 Android App (최신 빌드)"
          body: |
            📱 **안드로이드 설치 파일 (`kim-cookbook.apk`)**
            - 빌드 번호: `1.0.${{ github.run_number }}`
            - 커밋: `${{ github.sha }}`
            - 기본 레시피 오프라인 내장 + GitHub 최신 레시피 실시간 동기화
            - 스마트 인분 자동 계산기 (염도·기름·국물 증발량 비선형 보정)
            - 단계별 원터치 조리 타이머 (알람음·진동·화면 켜짐 유지)
          files: kim-cookbook.apk
          prerelease: false
          make_latest: true
