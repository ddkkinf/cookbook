name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: |
          SDK_MGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDK_MGR" --licenses > /dev/null || true

      - name: Install dependencies & sync recipes into Android assets
        run: |
          npm ci
          npm run sync

      - name: Build signed Release Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare & verify signed APK file
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk kim-cookbook.apk
          ls -lh kim-cookbook.apk
          keytool -printcert -jarfile kim-cookbook.apk | head -n 12

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kim-cookbook-apk
          path: kim-cookbook.apk
          if-no-files-found: error

      - name: Publish latest APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "김용훈의 레시피 Android App (최신 빌드 v1.1.${{ github.run_number }})"
          body: |
            📱 **안드로이드 정식 서명 설치 파일 (`kim-cookbook.apk`)**
            - 버전: `v1.1.${{ github.run_number }}` (`versionCode: 10${{ github.run_number }}`)
            - 커밋: `${{ github.sha }}`
            - 고정 서명 키스토어 적용 완료 (이후 모든 업데이트 시 삭제 없이 바로 덮어쓰기 업데이트 가능)
            - 인터랙티브 베리에이션(모드/옵션) + 30초 이상 조회 시 최상단 정렬 + 인분 계산기 + 멀티 타이머
          files: kim-cookbook.apk
          overwrite_files: true
          prerelease: false
          make_latest: true
