name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'docs/index.html'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/bundle-recipes.mjs'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: |
          SDK_MGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDK_MGR" --licenses > /dev/null || true

      - name: Install dependencies & sync recipes into Android assets
        run: |
          npm ci
          npm run sync

      - name: Build signed Release Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare & verify signed APK file
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk kim-cookbook.apk
          ls -lh kim-cookbook.apk
          keytool -printcert -jarfile kim-cookbook.apk | head -n 12

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kim-cookbook-apk
          path: kim-cookbook.apk
          if-no-files-found: error

      - name: Publish latest APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "개발자의레시피 · Developer's Recipe Android App (최신 빌드 v1.3.${{ github.run_number }})"
          body: |
            📱 **개발자의레시피 (`Developer's Recipe`) 안드로이드 정식 서명 설치 파일 (`kim-cookbook.apk`)**
            - 버전: `v1.3.${{ github.run_number }}` (`versionCode: 10${{ github.run_number }}`)
            - 커밋: `${{ github.sha }}`
            - **앱 기동/복귀 시 웹 레시피 자동 감지·반영 + 오프라인 로컬 폴백 엔진(`v1.3`)** 탑재
            - 이후 레시피 수정·신규 추가·일러스트 변경은 APK 재설치 없이 앱을 켜기만 하면 자동 반영됩니다.
          files: kim-cookbook.apk
          overwrite_files: true
          prerelease: false
          make_latest: true
