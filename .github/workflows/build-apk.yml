name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'docs/index.html'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/bundle-recipes.mjs'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK licenses
        run: |
          SDK_MGR=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | head -n 1)
          yes | "$SDK_MGR" --licenses > /dev/null || true

      - name: Install dependencies & sync recipes into Android assets
        run: |
          npm ci
          npm run sync

      - name: Build signed Release Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare & verify signed APK file
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk kim-cookbook.apk
          ls -lh kim-cookbook.apk
          keytool -printcert -jarfile kim-cookbook.apk | head -n 12

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kim-cookbook-apk
          path: kim-cookbook.apk
          if-no-files-found: error

      - name: Publish latest APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "개발자의레시피 · Developer's Recipe Android App (최신 빌드 v1.5.${{ github.run_number }})"
          body: |
            📱 **개발자의레시피 (`Developer's Recipe`) 안드로이드 정식 서명 설치 파일 (`kim-cookbook.apk`)**
            - 버전: `v1.5.${{ github.run_number }}`
            - 커밋: `${{ github.sha }}`
            - **무음·진동·미디어 음소거 무관 알람(`USAGE_ALARM` / `STREAM_ALARM`) + 화면 꺼짐·백그라운드 조리 타이머** 지원
            - **3종 스마트 정렬 (`최근에 본(30초+)` · `최근 추가된` · `많이 본`)** 홈 & 레시피 목록 탑재 + 검증/미검증 배지 제거로 깔끔한 UI 구성
            - **홈 메뉴 대시보드 + 하단 탭 네비게이션(홈 · 레시피 · 설정) + 고추장 비율 일괄 조절 옵션** 지원
            - 앱 기동/복귀 시 웹 레시피 자동 감지·반영 + 오프라인 로컬 폴백 지원
          files: kim-cookbook.apk
          overwrite_files: true
          prerelease: false
          make_latest: true
